# LegendMural uses Netlify as the single intended production host.
# GitHub Pages is not maintained as a parallel production target.
# PayPal is the only intended launch payment provider.
# PayPal remains sandbox-only unless live mode is explicitly enabled at deployment.

[build]
  command = "npm run build && node scripts/generate-commerce-runtime-config.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  LEGENDMURAL_HOSTED_CHECKOUT_ENDPOINT = "/api/paypal/checkout"
  LEGENDMURAL_ORDER_STATUS_ENDPOINT = "/api/order-status"
  LEGENDMURAL_PAYPAL_CAPTURE_ENDPOINT = "/api/paypal/capture"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/products/catalog.json"]

# Legacy Stripe fallback routes are retained temporarily until PayPal Sandbox +
# Neon staging, including webhook/reconciliation, is fully proven. They are not
# part of the intended launch architecture and will be removed in a later PR.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/create-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/paypal/checkout"
  to = "/.netlify/functions/create-paypal-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/paypal/capture"
  to = "/.netlify/functions/capture-paypal-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/order-status"
  to = "/.netlify/functions/order-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true
