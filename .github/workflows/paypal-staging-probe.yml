name: PayPal staging probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/paypal-staging-probe.yml'
      - 'netlify/functions/staging-db-check.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paypal-staging-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Verify Deploy Preview staging wiring
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait for matching Netlify Deploy Preview
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--legendmural.netlify.app
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .staging-probe
          ready='false'
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --output .staging-probe/config.json --write-out '%{http_code}' \
              "$PREVIEW_URL/.netlify/functions/staging-db-check" || true)
            if [ "$status" = '200' ]; then
              ready='true'
              break
            fi
            sleep 5
          done
          if [ "$ready" != 'true' ]; then
            echo 'Deploy Preview did not expose the staging diagnostic endpoint.' >&2
            exit 1
          fi

      - name: Verify staging database and Sandbox-only configuration
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('.staging-probe/config.json', 'utf8'));
          const required = [
            ['deployPreview', true],
            ['stagingDatabase', true],
            ['paypalSandboxConfigured', true],
            ['checkoutUrlsMatchPreview', true],
            ['livePaymentsAllowed', false],
          ];
          const failures = required.filter(([key, expected]) => report[key] !== expected);
          console.log(JSON.stringify({
            deployPreview: report.deployPreview,
            stagingDatabase: report.stagingDatabase,
            paypalSandboxConfigured: report.paypalSandboxConfigured,
            checkoutUrlsMatchPreview: report.checkoutUrlsMatchPreview,
            livePaymentsAllowed: report.livePaymentsAllowed,
          }));
          if (failures.length) {
            throw new Error(`Unsafe or incomplete staging configuration: ${failures.map(([key]) => key).join(', ')}`);
          }
          NODE

      - name: Create one real PayPal Sandbox order through the Deploy Preview
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--legendmural.netlify.app
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const catalog = JSON.parse(await readFile('data/products/catalog.json', 'utf8')).products;
          const product = catalog[0];
          const response = await fetch(`${process.env.PREVIEW_URL}/api/paypal/checkout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              request: {
                items: [{ page: product.page, quantity: 1 }],
                countryCode: 'NL',
              },
              customer: {
                firstname: 'LegendMural',
                lastname: 'Sandbox',
                email: 'paypal-staging@legendmural.invalid',
                street: 'Teststraat 10',
                zip: '1234 AB',
                city: 'Amsterdam',
                country: 'NL',
              },
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (response.status !== 201) {
            console.error(JSON.stringify({
              checkoutStatus: response.status,
              errorCode: payload?.error?.code || 'UNKNOWN',
            }));
            process.exit(1);
          }
          const approval = new URL(String(payload.url || ''));
          if (payload.provider !== 'paypal'
            || payload.mode !== 'test'
            || !/^[a-f0-9]{64}$/.test(String(payload.reference || ''))
            || !/^[A-Z0-9]{1,36}$/.test(String(payload.sessionId || ''))
            || approval.hostname !== 'www.sandbox.paypal.com') {
            throw new Error('Deploy Preview returned an unsafe or invalid PayPal Sandbox checkout response.');
          }

          const statusResponse = await fetch(`${process.env.PREVIEW_URL}/api/order-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              reference: payload.reference,
              sessionId: payload.sessionId,
            }),
          });
          const statusPayload = await statusResponse.json().catch(() => ({}));
          if (statusResponse.status !== 200
            || statusPayload.reference !== payload.reference
            || statusPayload.status !== 'payment_pending'
            || statusPayload.paid !== false) {
            throw new Error('New PayPal Sandbox order was not durably visible as payment_pending.');
          }

          await writeFile('.staging-probe/paypal-order.json', JSON.stringify({
            provider: payload.provider,
            mode: payload.mode,
            reference: payload.reference,
            sessionId: payload.sessionId,
            approvalUrl: payload.url,
            orderStatus: statusPayload.status,
            paid: statusPayload.paid,
          }, null, 2));
          console.log(JSON.stringify({
            checkoutCreated: true,
            mode: payload.mode,
            orderStatus: statusPayload.status,
            paid: statusPayload.paid,
          }));
          NODE

      - name: Upload private Sandbox approval artifact
        uses: actions/upload-artifact@v6
        with:
          name: paypal-sandbox-approval
          path: .staging-probe/paypal-order.json
          retention-days: 1
          if-no-files-found: error
