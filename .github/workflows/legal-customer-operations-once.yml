name: Legal customer operations one-off

on:
  push:
    branches:
      - agent/legal-customer-operations-v1
    paths:
      - .github/workflows/legal-customer-operations-once.yml

permissions:
  contents: write

jobs:
  build-customer-operations-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build customer operations pages
        run: node scripts/legal-customer-operations-once.mjs
      - name: Regenerate and validate managed commerce output
        run: |
          npm run generate:managed-product-pages:live
          npm run validate:managed-product-pages:live
          npm run generate:runtime-products
          npm run validate:runtime-products
          npm run generate:product-previews
          npm run validate:catalog
          git diff --check
      - name: Commit validated customer operations pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No customer operations changes to commit."
            exit 0
          fi
          git config user.name "legendmural-legal-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add shipping returns and FAQ customer pages"
          git push origin HEAD:agent/legal-customer-operations-v1
