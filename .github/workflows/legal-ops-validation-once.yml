name: Legal operations validation one-off
# pass 2: repair legal-page managed logo fallbacks

on:
  push:
    branches:
      - agent/legal-customer-operations-v1
    paths:
      - .github/workflows/legal-ops-validation-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Add standard footer logo fallback to legal pages
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const marker = '<div class="max-w-4xl mx-auto px-5 sm:px-6 lg:px-8 py-10 flex flex-wrap gap-x-5 gap-y-3 text-sm text-text-secondary">';
          const replacement = marker + '\n      <a href="index.html" class="logo-wrap mr-3" aria-label="LegendMural Home"><img src="media/LOGO/lm-logo-transparant.png" alt="" class="w-auto h-6 object-contain shrink-0 logo-glow" data-hide-on-error></a>';
          for (const path of ['privacy.html', 'terms.html']) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(marker)) throw new Error(`${path}: footer marker missing`);
            if ((source.match(/data-hide-on-error/g) || []).length !== 1) throw new Error(`${path}: expected one pre-existing managed logo`);
            source = source.replace(marker, replacement);
            fs.writeFileSync(path, source);
          }
          NODE
      - name: Withdrawal notification contract
        run: node --test tests/withdrawal-notification.test.mjs
      - name: Full quality gate
        run: npm run quality
      - name: Commit validated legal page fallback fix
        run: |
          git config user.name "legendmural-legal-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy.html terms.html
          git commit -m "Align legal pages with managed image fallback contract"
          git push origin HEAD:agent/legal-customer-operations-v1
