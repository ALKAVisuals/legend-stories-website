name: Apply Neon JSONB serialization fix

on:
  push:
    branches:
      - fix/neon-jsonb-serialization
    paths:
      - scripts/apply-neon-jsonb-fix.mjs
      - .github/workflows/apply-neon-jsonb-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/neon-jsonb-serialization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply JSONB serialization fix
        run: node scripts/apply-neon-jsonb-fix.mjs

      - name: Run focused Neon tests
        run: node --test tests/neon-order-store.test.mjs tests/neon-order-store-normalization.test.mjs tests/neon-jsonb-serialization.test.mjs

      - name: Validate Neon architecture
        run: |
          npm run validate:neon-order-store
          npm run validate:neon-integration

      - name: Remove temporary migration files
        run: rm scripts/apply-neon-jsonb-fix.mjs .github/workflows/apply-neon-jsonb-fix.yml

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Serialize Neon order JSONB parameters explicitly"
          git push origin HEAD:fix/neon-jsonb-serialization
