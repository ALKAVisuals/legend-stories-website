name: Temporary Google Places final validation

on:
  push:
    branches:
      - agent/google-places-resilience
    paths:
      - .github/workflows/temporary-google-places-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/google-places-resilience
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run complete quality gate
        run: npm run quality

      - name: Remove temporary workflow and commit validation marker
        run: |
          rm .github/workflows/temporary-google-places-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "Validate resilient Google Places loading"
          git push origin HEAD:agent/google-places-resilience
