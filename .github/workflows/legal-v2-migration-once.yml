name: Legal v2 migration one-off

on:
  push:
    branches:
      - agent/legal-customer-operations-v2
    paths:
      - .github/workflows/legal-v2-migration-once.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Fetch proven legal v1 implementation
        run: git fetch origin agent/legal-customer-operations-v1
      - name: Copy isolated legal and withdrawal files
        run: |
          set -euo pipefail
          files=(
            faq.html
            privacy.html
            returns.html
            shipping.html
            terms.html
            withdraw.html
            js/withdrawal.js
            netlify/functions/create-withdrawal.mjs
            server/adapters/neon-withdrawal-store.mjs
            server/api/create-withdrawal.mjs
            server/db/migrations/005_create_withdrawal_requests.sql
            server/db/migrations/006_grant_withdrawal_runtime.sql
            server/notifications/withdrawal-confirmation.mjs
            tests/withdrawal-api.test.mjs
            tests/withdrawal-notification.test.mjs
            tests/withdrawal-page-contract.test.mjs
            scripts/validate-image-error-fallbacks.mjs
            scripts/validate-shared-form-semantics.mjs
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/agent/legal-customer-operations-v1:$path" > "$path"
          done
      - name: Apply minimal legal integration to current main
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          // Keep the current-main return flow and add only the verified Order ID / withdrawal UI integration.
          let returnJs = fs.readFileSync('js/order-return.js', 'utf8');
          if (!returnJs.includes('orderIdBlock:')) {
            returnJs = returnJs.replace(
              "  note: document.getElementById('order-status-note'),",
              "  note: document.getElementById('order-status-note'),\n  orderIdBlock: document.getElementById('order-id-block'),\n  orderIdValue: document.getElementById('order-id-value'),\n  withdrawLink: document.getElementById('order-withdraw-link'),",
            );
          }
          if (!returnJs.includes('elements.orderIdValue.textContent = status.sessionId')) {
            returnJs = returnJs.replace(
              '  const copy = applyVerifiedOrderStatus(status, {',
              "  if (elements.orderIdValue) elements.orderIdValue.textContent = status.sessionId;\n  if (elements.orderIdBlock) elements.orderIdBlock.classList.remove('hidden');\n  if (elements.withdrawLink) {\n    elements.withdrawLink.href = `withdraw.html?order=${encodeURIComponent(status.sessionId)}`;\n    elements.withdrawLink.classList.remove('hidden');\n  }\n  const copy = applyVerifiedOrderStatus(status, {",
            );
          }
          fs.writeFileSync('js/order-return.js', returnJs);

          let success = fs.readFileSync('order-success.html', 'utf8');
          if (!success.includes('id="order-id-block"')) {
            success = success.replace(
              '<p id="order-status-note" class="mt-4 text-sm text-text-muted">',
              '<div id="order-id-block" class="hidden mt-6 rounded-xl border border-surface-border/30 bg-void/40 p-4 text-left"><p class="text-xs uppercase tracking-wider text-text-muted mb-1">Order ID</p><p id="order-id-value" class="font-mono text-sm break-all text-text-primary"></p><p class="text-xs text-text-muted mt-2">Keep this Order ID with your payment records. It can be used with your order email for the online withdrawal function.</p></div><p id="order-status-note" class="mt-4 text-sm text-text-muted">',
            );
          }
          if (!success.includes('id="order-withdraw-link"')) {
            success = success.replace(
              '<a href="index.html#contact" class="inline-flex items-center justify-center rounded-xl border border-surface-border/50 px-6 py-3 font-semibold text-text-secondary hover:text-mint hover:border-mint/40 transition-colors">Contact support</a>',
              '<a id="order-withdraw-link" href="withdraw.html" class="hidden inline-flex items-center justify-center rounded-xl border border-surface-border/50 px-6 py-3 font-semibold text-text-secondary hover:text-mint hover:border-mint/40 transition-colors">Withdraw from purchase</a><a href="index.html#contact" class="inline-flex items-center justify-center rounded-xl border border-surface-border/50 px-6 py-3 font-semibold text-text-secondary hover:text-mint hover:border-mint/40 transition-colors">Contact support</a>',
            );
          }
          fs.writeFileSync('order-success.html', success);

          const helpCurrent = '<div><p class="font-display font-bold text-sm uppercase tracking-wider text-text-primary mb-4">Help</p><ul class="space-y-2"><li><a href="index.html#contact" class="text-sm text-text-secondary hover:text-mint transition-colors">Contact</a></li></ul></div>';
          const helpLegal = '<div><p class="font-display font-bold text-sm uppercase tracking-wider text-text-primary mb-4">Help</p><ul class="space-y-2"><li><a href="index.html#contact" class="text-sm text-text-secondary hover:text-mint transition-colors">Contact</a></li><li><a href="shipping.html" class="text-sm text-text-secondary hover:text-mint transition-colors">Shipping</a></li><li><a href="returns.html" class="text-sm text-text-secondary hover:text-mint transition-colors">Returns</a></li><li><a href="withdraw.html" class="text-sm text-text-secondary hover:text-mint transition-colors">Withdraw a purchase</a></li><li><a href="faq.html" class="text-sm text-text-secondary hover:text-mint transition-colors">FAQ</a></li></ul></div>';
          const companyCurrent = '<div><p class="font-display font-bold text-sm uppercase tracking-wider text-text-primary mb-4">Company</p><ul class="space-y-2"><li><a href="about.html" class="text-sm text-text-secondary hover:text-mint transition-colors">About</a></li></ul></div>';
          const companyLegal = '<div><p class="font-display font-bold text-sm uppercase tracking-wider text-text-primary mb-4">Company</p><ul class="space-y-2"><li><a href="about.html" class="text-sm text-text-secondary hover:text-mint transition-colors">About</a></li><li><a href="privacy.html" class="text-sm text-text-secondary hover:text-mint transition-colors">Privacy</a></li><li><a href="terms.html" class="text-sm text-text-secondary hover:text-mint transition-colors">Terms</a></li></ul></div>';

          for (const path of [...fs.readdirSync('.').filter((name) => name.endsWith('.html')), 'templates/product-page.html']) {
            let html = fs.readFileSync(path, 'utf8');
            if (html.includes(helpCurrent)) html = html.replace(helpCurrent, helpLegal);
            if (html.includes(companyCurrent)) html = html.replace(companyCurrent, companyLegal);
            fs.writeFileSync(path, html);
          }

          const template = fs.readFileSync('templates/product-page.html', 'utf8');
          const templateSha = crypto.createHash('sha256').update(template).digest('hex');
          for (let batch = 1; batch <= 6; batch += 1) {
            const path = `data/products/2026-batch-${batch}-presentation.json`;
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.template = { ...(manifest.template || {}), sha256: templateSha };
            fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE
      - name: Regenerate managed storefront output
        run: |
          npm run generate:managed-product-pages:live
          npm run validate:managed-product-pages:live
          npm run generate:runtime-products
          npm run validate:runtime-products
          npm run generate:product-previews
          npm run validate:catalog
          git diff --check
      - name: Legal and withdrawal regression tests
        run: node --test tests/withdrawal-api.test.mjs tests/withdrawal-page-contract.test.mjs tests/withdrawal-notification.test.mjs
      - name: Full quality gate
        run: npm run quality
      - name: Commit only after all gates pass
        run: |
          git config user.name "legendmural-legal-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/legal-v2-migration-once.yml
          git commit -m "Rebuild legal and withdrawal layer on current main"
          git push origin HEAD:agent/legal-customer-operations-v2
