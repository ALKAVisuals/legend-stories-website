name: Paid-order email branch check

on:
  push:
    branches:
      - feature/paid-order-email-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-order-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run paid-order email tests
        run: node --test tests/paid-order-notifications.test.mjs tests/resend-paid-order-notifier.test.mjs
