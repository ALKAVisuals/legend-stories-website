name: One-time product card navigation migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refactor/product-card-navigation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and media tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run corrected deterministic migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          workflow_path = '.github/workflows/one-time-product-card-navigation.yml'
          source_commit = '8387b49fdfe683fe92919c139980496c62982235'
          reviewed = subprocess.check_output(
              ['git', 'show', f'{source_commit}:{workflow_path}'],
              text=True,
          )
          match = re.search(
              r"          python - <<'PY'\n(?P<script>[\s\S]*?)\n          PY",
              reviewed,
          )
          if not match:
              raise SystemExit('Could not recover the reviewed migration script')

          migration_script = textwrap.dedent(match.group('script'))
          exec(compile(migration_script, '<product-card-migration>', 'exec'), {})

          validator_path = Path('scripts/validate-product-card-navigation.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace(
              'const expectedCards = 232;\nconst errors = [];\nlet cardCount = 0;',
              'const expectedExplicitCards = 232;\n'
              'const expectedTotalCards = 233;\n'
              'const errors = [];\n'
              'let explicitCardCount = 0;\n'
              'let totalCardCount = 0;',
              1,
          )
          validator = validator.replace(
              "    cardCount += 1;\n\n"
              "    const href = attribute(attributes, 'data-product-href');\n"
              "    if (!href) errors.push(`${file}: product card has no data-product-href`);",
              "    totalCardCount += 1;\n\n"
              "    const href = attribute(attributes, 'data-product-href');\n"
              "    if (!href) {\n"
              "      if (/\\bonclick\\s*=/.test(attributes)) {\n"
              "        errors.push(`${file}: legacy product card still has inline onclick`);\n"
              "      }\n"
              "      if (/class=[\"'][^\"']*add-to-cart-btn[^\"']*[\"'][^>]*\\bonclick\\s*=/i.test(body)) {\n"
              "        errors.push(`${file}: legacy add-to-cart button still has inline onclick`);\n"
              "      }\n"
              "      continue;\n"
              "    }\n"
              "    explicitCardCount += 1;",
              1,
          )
          validator = validator.replace('${href || cardCount}', '${href || explicitCardCount}')
          validator = validator.replace(
              "if (cardCount !== expectedCards) {\n"
              "  errors.push(`Expected ${expectedCards} product cards, found ${cardCount}`);\n"
              "}",
              "if (explicitCardCount !== expectedExplicitCards) {\n"
              "  errors.push(`Expected ${expectedExplicitCards} explicit product cards, found ${explicitCardCount}`);\n"
              "}\n"
              "if (totalCardCount !== expectedTotalCards) {\n"
              "  errors.push(`Expected ${expectedTotalCards} total product cards, found ${totalCardCount}`);\n"
              "}",
              1,
          )
          validator = validator.replace(
              'console.log(`Validated ${cardCount} centralized, keyboard-accessible product cards.`);',
              'console.log(`Validated ${explicitCardCount} centralized cards across ${totalCardCount} product cards.`);',
              1,
          )
          if 'expectedExplicitCards' not in validator or 'totalCardCount' not in validator:
              raise SystemExit('Corrected validator replacements were not applied')
          validator_path.write_text(validator, encoding='utf-8')

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          generated = (
              '    await Promise.all([loadCommerceModule(), loadProductCardNavigationModule()]);\n'
              '    loadCart();  // Restore cart after commerce policies are available'
          )
          corrected = (
              '    await loadCommerceModule();\n'
              '    loadCart();  // Restore cart after commerce policies are available\n'
              '    await loadProductCardNavigationModule();'
          )
          if app.count(generated) != 1:
              raise SystemExit(f'Expected one generated initialization block, found {app.count(generated)}')
          app = app.replace(generated, corrected, 1)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Validate focused migration
        run: |
          node scripts/validate-product-card-navigation.mjs
          node scripts/inline-handler-audit.mjs
          node --test tests/product-card-navigation.test.mjs
          git diff --check

      - name: Run full quality gate
        run: npm run quality

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html combat-legends.html music-legends.html sport-legends.html wisdom-legends.html \
            js/app.js js/product-card-navigation.mjs package.json \
            scripts/validate-product-card-navigation.mjs tests/product-card-navigation.test.mjs
          git commit -m "Centralize product card navigation"
          git push origin HEAD:refactor/product-card-navigation

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-product-card-navigation.yml
          git add .github/workflows/one-time-product-card-navigation.yml
          git commit -m "Remove one-time product card migration workflow"
          git push origin HEAD:refactor/product-card-navigation
