name: Cloudflare Production read-only inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-production-readonly-inventory.yml'
      - 'scripts/inventory-cloudflare-production-account.mjs'
      - 'tests/cloudflare-production-readonly-inventory-workflow.test.mjs'
  workflow_dispatch:
    inputs:
      confirm_phrase:
        description: 'Type PRODUCTION_INVENTORY_READ_ONLY to authorize GET-only Cloudflare Production inventory.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-readonly-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Production inventory policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate GET-only inventory policy
        run: node --test tests/cloudflare-production-readonly-inventory-workflow.test.mjs

  inventory:
    name: Inventory Cloudflare Gate 0 read-only
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Require exact manual read-only confirmation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.confirm_phrase }}' != 'PRODUCTION_INVENTORY_READ_ONLY' ]; then
            echo '::error::Refusing to run: confirm_phrase must equal PRODUCTION_INVENTORY_READ_ONLY.'
            exit 1
          fi

      - name: Require Cloudflare credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::Missing GitHub secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Re-prove GET-only policy before account access
        run: node --test tests/cloudflare-production-readonly-inventory-workflow.test.mjs

      - name: Inventory Production zone, Worker, secret names and R2 exposure with GET only
        run: node scripts/inventory-cloudflare-production-account.mjs


  neon_runtime_role_probe:
    name: Read-only Production order-status DB probe
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise existing Production Neon read path without customer data
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://legendmural.com/api/order-status'
          payload='{"reference":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","sessionId":"5O190127TN364715T"}'

          for i in $(seq 1 90); do
            status="$(
              curl --silent --show-error                 --output /dev/null                 --write-out '%{http_code}'                 --request POST                 --header 'Content-Type: application/json'                 --header 'Origin: https://legendmural.com'                 --data "$payload"                 "$endpoint"
            )"

            if [ "$status" != '404' ]; then
              echo "::error::Expected HTTP 404 from nonexistent read-only order lookup; got $status."
              exit 1
            fi

            sleep 1
          done

          echo "Read-only Production Neon lookup probe completed."
