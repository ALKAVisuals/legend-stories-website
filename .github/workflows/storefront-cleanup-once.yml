name: Storefront cleanup one-off

on:
  push:
    branches:
      - agent/storefront-launch-cleanup-v2
    paths:
      - .github/workflows/storefront-cleanup-once.yml

permissions:
  contents: write

jobs:
  normalize-static-storefront:
    if: github.ref == 'refs/heads/agent/storefront-launch-cleanup-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-launch-cleanup-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize static storefront pages
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'index.html',
            'shop.html',
            'music-legends.html',
            'sport-legends.html',
            'combat-legends.html',
            'wisdom-legends.html',
            'about.html',
          ];

          for (const path of files) {
            if (!fs.existsSync(path)) continue;
            let html = fs.readFileSync(path, 'utf8');

            // Customer-facing current brand only; legacy URLs are intentionally untouched.
            html = html.replaceAll('Legend Stories', 'LegendMural');

            // New storefront actions must emit canonical 45 cm Statement identity.
            html = html.replaceAll('statement-50x50', 'statement-45');
            html = html.replaceAll('data-size-label="50 × 50 cm"', 'data-size-label="45 cm"');
            html = html.replaceAll('data-width-cm="50"', 'data-width-cm="45"');
            html = html.replaceAll('data-height-cm="50"', 'data-height-cm="45"');
            html = html.replaceAll('data-longest-side-cm="50"', 'data-longest-side-cm="45"');

            // Stale visible Statement marketing price.
            html = html.replaceAll('€49,95', '€45');

            // Authoritative launch shipping threshold / market scope.
            html = html.replaceAll('Free shipping on orders over €50', 'Free shipping from €69 after discount');
            html = html.replaceAll('2 to 4 working days. Ships across Europe.', 'Shipping available in the Netherlands, EU and United States.');

            // PayPal-only launch surface: remove unsupported standalone badges when this exact legacy group exists.
            html = html.replace('<div class="px-2 py-1 rounded bg-surface-light text-[10px] text-text-muted font-medium">iDEAL</div><div class="px-2 py-1 rounded bg-surface-light text-[10px] text-text-muted font-medium">Visa</div><div class="px-2 py-1 rounded bg-surface-light text-[10px] text-text-muted font-medium">Mastercard</div>', '');

            // Placeholder WhatsApp must not ship.
            html = html.replace(/\n\s*<!-- WHATSAPP -->[\s\S]*?\n\s*<!-- CHECKOUT DRAWER -->/, '\n\n  <!-- CHECKOUT DRAWER -->');

            // Remove residual unsupported bestseller wording from image accessibility text.
            html = html.replaceAll(' — Best Selling Music Legend Wall Sticker', ' — Music Legend Wall Sticker');

            fs.writeFileSync(path, html);
          }
          NODE

          git diff --check
          git diff -- index.html shop.html music-legends.html sport-legends.html combat-legends.html wisdom-legends.html about.html
      - name: Commit static storefront normalization
        shell: bash
        run: |
          if git diff --quiet -- index.html shop.html music-legends.html sport-legends.html combat-legends.html wisdom-legends.html about.html; then
            echo "No static storefront changes to commit."
            exit 0
          fi
          git config user.name "legendmural-cleanup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html shop.html music-legends.html sport-legends.html combat-legends.html wisdom-legends.html about.html
          git commit -m "Normalize static storefront launch data"
          git push origin HEAD:agent/storefront-launch-cleanup-v2
