name: Update withdrawal Neon integration once

on:
  push:
    branches:
      - agent/legal-customer-operations-v2
    paths:
      - 'scripts/update-withdrawal-neon-integration-once.mjs'
      - '.github/workflows/update-withdrawal-neon-integration-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node scripts/update-withdrawal-neon-integration-once.mjs
      - run: npm run quality
      - name: Commit validated Neon integration updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db/migrations/006_grant_withdrawal_runtime.sql scripts/run-neon-test-migrations.mjs scripts/test-neon-order-store-integration.mjs scripts/validate-neon-integration-harness.mjs docs/NEON_INTEGRATION_ACTIVATION.md
          git diff --cached --quiet && exit 0
          git commit -m 'test: extend Neon integration through withdrawal migrations'
          git push origin HEAD:agent/legal-customer-operations-v2
