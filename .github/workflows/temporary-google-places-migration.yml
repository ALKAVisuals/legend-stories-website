name: Temporary Google Places migration

on:
  push:
    branches:
      - agent/google-places-resilience
    paths:
      - .github/workflows/temporary-google-places-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/google-places-resilience
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply migration and validate
        shell: bash
        run: |
          set +e
          node scripts/migrate-google-places-loader.mjs > /tmp/google-places-migration.log 2>&1
          migration_status=$?
          if [ "$migration_status" -ne 0 ]; then
            {
              echo "stage=migration"
              echo "exit_code=$migration_status"
              tail -n 180 /tmp/google-places-migration.log
            } > google-places-migration-diagnostic.txt
          else
            npm run quality > /tmp/google-places-quality.log 2>&1
            quality_status=$?
            if [ "$quality_status" -ne 0 ]; then
              {
                echo "stage=quality"
                echo "exit_code=$quality_status"
                tail -n 260 /tmp/google-places-quality.log
              } > google-places-migration-diagnostic.txt
            fi
          fi

      - name: Commit diagnostic or validated result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f google-places-migration-diagnostic.txt ]; then
            git add google-places-migration-diagnostic.txt
            git commit -m "Record Google Places migration diagnostic"
            git push origin HEAD:agent/google-places-resilience
            exit 0
          fi
          rm scripts/migrate-google-places-loader.mjs .github/workflows/temporary-google-places-migration.yml
          git add -A
          git diff --cached --quiet && { echo "No validated changes to commit"; exit 1; }
          git commit -m "Harden Google Places loading"
          git push origin HEAD:agent/google-places-resilience
