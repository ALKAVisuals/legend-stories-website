name: One-time Actions artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-artifacts-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Delete all stored Actions artifacts in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .size_in_bytes, .name] | @tsv' > /tmp/artifacts.tsv

          count=$(wc -l < /tmp/artifacts.tsv | tr -d ' ')
          bytes=$(awk -F '\t' '{sum += $2} END {printf "%.0f", sum+0}' /tmp/artifacts.tsv)
          mb=$(awk -v b="$bytes" 'BEGIN {printf "%.1f", b/1024/1024}')

          echo "Found ${count} artifacts using approximately ${mb} MiB."

          while IFS=$'\t' read -r id size name; do
            [ -n "${id:-}" ] || continue
            echo "Deleting artifact ${id}: ${name} (${size} bytes)"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
          done < /tmp/artifacts.tsv

          remaining=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq '.total_count')
          echo "Remaining artifacts: ${remaining}"
          if [ "$remaining" != "0" ]; then
            echo "::error::Artifact cleanup incomplete; ${remaining} artifacts remain."
            exit 1
          fi

          {
            echo "## Actions artifact cleanup"
            echo "- Deleted artifacts: ${count}"
            echo "- Approximate storage removed: ${mb} MiB"
            echo "- Remaining artifacts: ${remaining}"
          } >> "$GITHUB_STEP_SUMMARY"
