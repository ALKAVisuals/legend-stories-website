name: Generate homepage marketing WebP

on:
  push:
    branches:
      - perf/sprint-3g-homepage-marketing-webp
    paths:
      - 'data/media/homepage-marketing-derivatives.json'
      - 'scripts/generate-homepage-marketing-webp.mjs'
      - 'scripts/lib/marketing-image-derivatives.mjs'
      - '.github/workflows/generate-homepage-marketing-webp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-marketing-webp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    name: Generate verified WebP derivatives
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: perf/sprint-3g-homepage-marketing-webp

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Generate homepage WebP derivatives
        run: node scripts/generate-homepage-marketing-webp.mjs

      - name: Validate generated derivatives
        run: node scripts/validate-homepage-marketing-webp.mjs

      - name: Commit generated assets and homepage markup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html \
            "media/voorbeelden/Arnold S.webp" \
            "media/voorbeelden/Fightclub.webp" \
            "media/voorbeelden/Ibrahimovic.webp" \
            "media/voorbeelden/Ice Cube.webp" \
            "media/voorbeelden/Mike T..webp"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "perf: add verified homepage WebP derivatives"
          git push origin HEAD:perf/sprint-3g-homepage-marketing-webp

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homepage-marketing-webp-validation
          path: |
            reports/homepage-marketing-webp.json
            reports/homepage-marketing-webp.md
          if-no-files-found: error
          retention-days: 14
