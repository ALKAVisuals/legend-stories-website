name: Apply product browser derivatives

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-browser-derivatives
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/product-browser-derivatives'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-browser-derivatives
          fetch-depth: 0

      - name: Verify branch scope
        run: |
          test "$(git branch --show-current)" = "agent/product-browser-derivatives"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Apply bounded browser-reference migration
        run: node scripts/migrate-product-browser-derivatives.mjs

      - name: Generate transparent browser derivatives
        run: npm run generate:product-browser-derivatives

      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Generate runtime product registry
        run: npm run generate:runtime-products

      - name: Validate product browser derivatives
        run: npm run validate:product-browser-derivatives

      - name: Run complete repository quality gate
        run: npm run quality

      - name: Remove temporary migration tooling
        run: |
          rm .github/workflows/apply-product-browser-derivatives.yml
          rm scripts/migrate-product-browser-derivatives.mjs

      - name: Commit validated browser derivatives
        run: |
          git config user.name "LegendMural Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit."; exit 1; }
          git commit -m "Add product browser derivatives"
          git push origin HEAD:agent/product-browser-derivatives
