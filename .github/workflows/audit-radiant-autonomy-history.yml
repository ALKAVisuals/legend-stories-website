name: Audit Radiant Autonomy history

on:
  push:
    branches:
      - audit/radiant-autonomy-history
    paths:
      - "scripts/audit_radiant_autonomy_history.py"
      - ".github/workflows/audit-radiant-autonomy-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --upgrade pip Pillow

      - name: Compare historical and current pixels
        run: python scripts/audit_radiant_autonomy_history.py

      - name: Commit audit evidence to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/radiant-autonomy-history-audit.json docs/audits/radiant-autonomy-history-audit.md
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Record Radiant Autonomy history audit"
          git pull --rebase origin audit/radiant-autonomy-history
          git push origin HEAD:audit/radiant-autonomy-history
