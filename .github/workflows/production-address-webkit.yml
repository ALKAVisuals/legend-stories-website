name: Production address WebKit probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-address-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-address-probe:
    name: Production iPhone address probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install pinned Playwright WebKit for this probe only
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Run read-only production address probe
        run: node tests/browser/production-address-webkit.mjs

      - name: Upload diagnostics on failure only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-address-webkit-diagnostics
          path: |
            /tmp/production-address-webkit.png
            /tmp/production-address-webkit.html
          if-no-files-found: warn
          retention-days: 1
