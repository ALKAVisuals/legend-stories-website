name: Apply dialog accessibility migration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dialog-accessibility-migration.yml
      - scripts/migrate-dialog-accessibility.mjs
      - js/dialog-accessibility.mjs
      - tests/dialog-accessibility.test.mjs
      - scripts/validate-dialog-accessibility.mjs
      - package.json

permissions:
  contents: write

concurrency:
  group: dialog-accessibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.ref == 'agent/dialog-accessibility' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/dialog-accessibility
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded migration
        run: node scripts/migrate-dialog-accessibility.mjs

      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Normalize return-page footer headings
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import { extname } from 'node:path';

          const pattern = /<h4 class="font-display font-bold text-sm uppercase tracking-wider text-text-primary mb-4">([\s\S]*?)<\/h4>/g;
          let pages = 0;
          let headings = 0;
          for (const entry of await readdir('.', { withFileTypes: true })) {
            if (!entry.isFile() || extname(entry.name).toLowerCase() !== '.html') continue;
            const html = await readFile(entry.name, 'utf8');
            const matches = [...html.matchAll(pattern)];
            if (matches.length === 0) continue;
            pages += 1;
            headings += matches.length;
            await writeFile(
              entry.name,
              html.replace(pattern, '<h3 class="font-display font-bold text-sm uppercase tracking-wider text-text-primary mb-4">$1</h3>'),
              'utf8',
            );
          }
          if (pages !== 2 || headings !== 6) {
            throw new Error(`Expected two return pages and six footer headings, found ${pages} pages and ${headings} headings.`);
          }
          console.log(`Normalized ${headings} footer headings across ${pages} return pages.`);
          NODE

      - name: Require zero static accessibility findings
        run: |
          node scripts/accessibility-purchase-flow-audit.mjs
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('reports/accessibility-purchase-flow-audit.json', 'utf8'));
          const summary = report.summary;
          if (summary.errors !== 0 || summary.warnings !== 0 || summary.reviewItems !== 0) {
            console.error(JSON.stringify(report.issueGroups, null, 2));
            throw new Error(`Expected zero accessibility findings, received ${summary.errors} errors, ${summary.warnings} warnings and ${summary.reviewItems} review items.`);
          }
          console.log(`Accessibility audit clean across ${summary.pages} pages.`);
          NODE

      - name: Run complete repository quality gate
        run: npm run quality

      - name: Remove temporary migration tooling
        run: git rm .github/workflows/dialog-accessibility-migration.yml scripts/migrate-dialog-accessibility.mjs

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement accessible cart and checkout dialogs"
          git push origin HEAD:agent/dialog-accessibility
