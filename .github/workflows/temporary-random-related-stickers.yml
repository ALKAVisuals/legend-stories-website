name: Temporary random related stickers migration

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/random-related-stickers-migration.mjs
      - .github/workflows/temporary-random-related-stickers.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize related sticker discovery
        run: node scripts/random-related-stickers-migration.mjs

      - name: Run full quality gate
        run: npm run quality

      - name: Publish materialized implementation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm scripts/random-related-stickers-migration.mjs
          git rm .github/workflows/temporary-random-related-stickers.yml
          git commit -m "Build randomized related sticker discovery"
          git push origin "HEAD:${HEAD_BRANCH}"
