name: Apply collection video loading policy

on:
  pull_request:
    branches:
      - main
    paths:
      - 'js/collection-video.mjs'
      - 'js/media/collection-video-policy.mjs'
      - 'scripts/migrate-collection-video-loading.mjs'
      - '.github/workflows/apply-collection-video-loading.yml'

permissions:
  contents: write

concurrency:
  group: apply-collection-video-loading-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate four collection pages
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Apply deferred loading migration
        run: node scripts/migrate-collection-video-loading.mjs

      - name: Commit only collection page changes
        shell: bash
        run: |
          approved=(
            "combat-legends.html"
            "music-legends.html"
            "sport-legends.html"
            "wisdom-legends.html"
          )
          declare -A approved_map=()
          for file in "${approved[@]}"; do approved_map["$file"]=1; done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${approved[@]}"

          unexpected=()
          while IFS= read -r -d '' file; do
            [[ -n "${approved_map[$file]:-}" ]] || unexpected+=("$file")
          done < <(git diff --cached --name-only -z)
          if ((${#unexpected[@]})); then
            echo "::error::Unexpected files changed during collection video migration:"
            printf '%s\n' "${unexpected[@]}"
            exit 1
          fi

          if [[ -n "$(git diff --name-only)" || -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo "::error::Unstaged or untracked files remain after migration."
            git status --short
            exit 1
          fi

          git diff --cached --quiet || git commit -m "perf: defer collection video loading"
          git push
