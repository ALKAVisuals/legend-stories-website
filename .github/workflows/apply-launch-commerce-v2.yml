name: Verify launch commerce v2

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launch-commerce-v2
  cancel-in-progress: true

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-commerce-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore canonical launch contracts
        run: node scripts/apply-launch-commerce-v2-fixes.mjs

      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Validate product variants
        run: npm run validate:product-variants

      - name: Validate full product catalog
        run: npm run validate:full-catalog

      - name: Validate managed product pages
        run: npm run validate:managed-product-pages:live

      - name: Validate commerce runtime
        run: npm run validate:commerce-runtime

      - name: Validate Stripe checkout
        run: npm run validate:stripe-checkout

      - name: Run full test suite
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Commit regenerated product pages
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Generated product pages are already current.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate launch commerce product pages"
          git push origin HEAD:agent/launch-commerce-v2
