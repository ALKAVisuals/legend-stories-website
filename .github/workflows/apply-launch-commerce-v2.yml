name: Apply launch commerce v2

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launch-commerce-v2
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout clean v2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-commerce-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load deterministic implementation from verified source
        shell: bash
        run: |
          git fetch --no-tags origin agent/launch-commerce-v1
          git show FETCH_HEAD:scripts/migrate-launch-commerce-v1.mjs > /tmp/apply-launch-commerce-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Apply launch commerce implementation from current main baseline
        run: node /tmp/apply-launch-commerce-v2.mjs

      - name: Apply v2 contract corrections
        run: node scripts/apply-launch-commerce-v2-fixes.mjs

      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Verify launch implementation
        id: verify
        shell: bash
        run: |
          set +e
          : > launch-commerce-v2-ci.log
          run_check() {
            printf '\n===== %s =====\n' "$1" | tee -a launch-commerce-v2-ci.log
            shift
            "$@" 2>&1 | tee -a launch-commerce-v2-ci.log
            status=${PIPESTATUS[0]}
            printf 'EXIT_STATUS=%s\n' "$status" | tee -a launch-commerce-v2-ci.log
            return "$status"
          }

          failed=0
          run_check 'validate product variants' npm run validate:product-variants || failed=1
          run_check 'validate full product catalog' npm run validate:full-catalog || failed=1
          run_check 'validate live managed pages' npm run validate:managed-product-pages:live || failed=1
          run_check 'validate commerce runtime' npm run validate:commerce-runtime || failed=1
          run_check 'validate Stripe checkout' npm run validate:stripe-checkout || failed=1
          run_check 'full test suite' npm test || failed=1
          run_check 'production build' npm run build || failed=1

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record implementation and verification report
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
          else
            if [ "${{ steps.verify.outputs.failed }}" = "0" ]; then
              git commit -m "Implement and verify launch commerce v2"
            else
              git commit -m "Apply launch commerce v2 and record failing verification"
            fi
            git push origin HEAD:agent/launch-commerce-v2
          fi

      - name: Fail workflow after preserving report
        if: steps.verify.outputs.failed != '0'
        run: |
          echo 'Launch commerce verification failed. Exact output is committed in launch-commerce-v2-ci.log.'
          exit 1
