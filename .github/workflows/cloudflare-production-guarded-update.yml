name: Cloudflare Production guarded update

on:
  workflow_dispatch:
    inputs:
      confirm_phrase:
        description: 'Type DEPLOY_GUARDED_V3_CHECKOUT_LAUNCH to authorize the guarded Production checkout launch.'
        required: true
        type: string
      expected_commit:
        description: 'Exact 40-character main commit SHA that is approved for deployment.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-guarded-update
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact guarded Production Worker update
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_PHRASE: ${{ inputs.confirm_phrase }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}

    steps:
      - name: Require exact owner confirmation, main ref and approved commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Refusing to deploy: this workflow may only run from main.'
            exit 1
          fi
          if [ "$CONFIRM_PHRASE" != 'DEPLOY_GUARDED_V3_CHECKOUT_LAUNCH' ]; then
            echo '::error::Refusing to deploy: confirmation phrase is incorrect.'
            exit 1
          fi
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Refusing to deploy: expected_commit must be an exact lowercase 40-character SHA.'
            exit 1
          fi
          if [ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to deploy: approved commit $EXPECTED_COMMIT does not match workflow commit $GITHUB_SHA."
            exit 1
          fi

      - name: Require established Cloudflare credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::Missing GitHub secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi

      - name: Check out the exact approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact application dependencies
        run: npm ci

      - name: Re-prove checkout launch and Cloudflare guarded contracts before account mutation
        run: >-
          node --test
          tests/p3-controlled-payment.test.mjs
          tests/cloudflare-config.test.mjs
          tests/cloudflare-v3-paid-finalization-config.test.mjs
          tests/cloudflare-r2-neon-v3-invoice-artifact-binding.test.mjs
          tests/cloudflare-production-guarded-update-workflow.test.mjs

      - name: Build storefront static assets
        run: npm run build

      - name: Verify existing active Production Worker, guarded flags, required secret names and private R2
        run: node scripts/verify-cloudflare-production-guarded-update.mjs predeploy

      - name: Bundle exact Production update without deployment
        run: >-
          npx --yes wrangler@4.129.0 deploy
          --env production
          --dry-run
          --outdir .wrangler-dry-run/production-guarded-update

      - name: Deploy exact guarded Production Worker update
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: deploy --env production

      - name: Verify remote guarded state and required secret names after deployment
        run: node scripts/verify-cloudflare-production-guarded-update.mjs postdeploy

      - name: Prove public checkout route is active without creating an order
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch('https://legendmural.com/api/paypal/checkout', {
            method: 'OPTIONS',
            headers: {
              Origin: 'https://legendmural.com',
              'Access-Control-Request-Method': 'POST',
            },
          });
          const allowedOrigin = response.headers.get('access-control-allow-origin') || '';
          const allowedMethods = response.headers.get('access-control-allow-methods') || '';
          if (response.status !== 204) {
            throw new Error(`Checkout route proof failed: expected HTTP 204, received ${response.status}.`);
          }
          if (allowedOrigin !== 'https://legendmural.com') {
            throw new Error(`Checkout route proof failed: unexpected Access-Control-Allow-Origin ${allowedOrigin || 'missing'}.`);
          }
          if (!allowedMethods.split(',').map((value) => value.trim()).includes('POST')) {
            throw new Error(`Checkout route proof failed: POST is missing from Access-Control-Allow-Methods (${allowedMethods || 'missing'}).`);
          }
          console.log('[cloudflare-production-guarded-update] live checkout route is active; OPTIONS probe created no PayPal order.');
          NODE

      - name: Record guarded deployment boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Cloudflare Production guarded update boundary'
            echo
            echo "- Approved commit: $GITHUB_SHA"
            echo '- Intended Worker: legendmural-cloudflare-production'
            echo '- Customer checkout intended state: active'
            echo '- P3 test checkout intended state: disabled'
            echo '- PayPal Live client intended state: allowed'
            echo '- Production order emails intended state: enabled'
            echo '- V3 Profile-1 creation intended state: enabled'
            echo '- V3 invoice storage intended state: enabled'
            echo '- V3 invoice reconciliation intended state: enabled'
            echo '- V3 dashboard invoice API intended state: disabled'
            echo '- Postdeploy checkout proof: safe OPTIONS only; no PayPal order created'
            echo '- Secret values printed or committed: none'
            echo '- DNS/custom-domain commands: none'
            echo '- R2 object writes: none'
            echo '- Netlify Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
