name: Audit launch commerce v2

on:
  push:
    branches:
      - agent/launch-commerce-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-commerce-v2
          fetch-depth: 1

      - name: Show repository state
        run: |
          git rev-parse HEAD
          git status --short
          node --version
          npm --version

      - name: Locate launch commerce references
        shell: bash
        run: |
          set -o pipefail
          for pattern in \
            'statement-45' \
            'compact-30' \
            'WELCOME15' \
            'LEGEND10' \
            'Greece' \
            "'GR'" \
            'shippingCountry' \
            'freeFrom' \
            'sizeCm' \
            'successful checkout forwards Stripe shipping details into the canonical order'; do
            echo "===== ${pattern} ====="
            grep -RInF --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist -- "$pattern" . || true
          done

      - name: List commerce and test files
        shell: bash
        run: |
          echo '===== commerce files ====='
          find js/commerce server/commerce server/payments -maxdepth 3 -type f | sort
          echo '===== tests ====='
          find tests -maxdepth 2 -type f -name '*.test.mjs' | sort
          echo '===== validators ====='
          find scripts -maxdepth 1 -type f \( -name '*commerce*' -o -name '*checkout*' -o -name '*variant*' -o -name '*catalog*' \) | sort
