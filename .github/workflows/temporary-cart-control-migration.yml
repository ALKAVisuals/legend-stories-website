name: Temporary cart control migration

on:
  push:
    branches:
      - agent/cart-control-delegation
    paths:
      - .github/workflows/temporary-cart-control-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/cart-control-delegation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply exact cart control migration
        run: node scripts/migrate-cart-controls.mjs

      - name: Run complete quality gate
        run: npm run quality

      - name: Remove temporary migration tooling
        run: rm scripts/migrate-cart-controls.mjs .github/workflows/temporary-cart-control-migration.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No validated changes to commit"; exit 1; }
          git commit -m "Delegate cart item controls"
          git push origin HEAD:agent/cart-control-delegation
