name: One-off production domain migration

on:
  push:
    branches:
      - agent/production-domain-legendmural-com

permissions:
  contents: write

jobs:
  migrate-domain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-domain-legendmural-com
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate runtime-facing production origin
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const OLD = 'https://alkavisuals.github.io/legend-stories-website';
          const NEW = 'https://legendmural.com';
          const ROOT = process.cwd();
          const allowedExtensions = new Set([
            '.html', '.json', '.mjs', '.js', '.css', '.xml', '.txt', '.toml', '.tsv', '.webmanifest'
          ]);
          const skippedDirectories = new Set(['.git', 'node_modules', 'dist', 'docs', '.github']);

          function migrateDirectory(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (skippedDirectories.has(entry.name)) continue;
              const filePath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                migrateDirectory(filePath);
                continue;
              }
              if (!allowedExtensions.has(path.extname(entry.name))) continue;
              const source = fs.readFileSync(filePath, 'utf8');
              if (!source.includes(OLD)) continue;
              fs.writeFileSync(filePath, source.replaceAll(OLD, NEW));
              console.log(`migrated ${path.relative(ROOT, filePath)}`);
            }
          }

          migrateDirectory(ROOT);

          let homepage = fs.readFileSync('index.html', 'utf8');
          homepage = homepage
            .replace(`<meta property="og:url" content="${NEW}/index.html">`, `<meta property="og:url" content="${NEW}/">`)
            .replace(`<link rel="canonical" href="${NEW}/index.html">`, `<link rel="canonical" href="${NEW}/">`);
          fs.writeFileSync('index.html', homepage);

          let netlify = fs.readFileSync('netlify.toml', 'utf8').trimEnd();
          const redirectMarker = 'from = "https://legendmural.netlify.app/*"';
          if (!netlify.includes(redirectMarker)) {
            netlify += `\n\n# Canonical production-domain redirects. These rules only apply once the domains are assigned to this Netlify site.\n[[redirects]]\n  from = "http://legendmural.com/*"\n  to = "https://legendmural.com/:splat"\n  status = 301\n  force = true\n\n[[redirects]]\n  from = "http://www.legendmural.com/*"\n  to = "https://legendmural.com/:splat"\n  status = 301\n  force = true\n\n[[redirects]]\n  from = "https://www.legendmural.com/*"\n  to = "https://legendmural.com/:splat"\n  status = 301\n  force = true\n\n[[redirects]]\n  from = "https://legendmural.netlify.app/*"\n  to = "https://legendmural.com/:splat"\n  status = 301\n  force = true\n`;
            fs.writeFileSync('netlify.toml', netlify);
          }

          const testSource = `import assert from 'node:assert/strict';
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';
          import test from 'node:test';

          const OLD = ['https://alkavisuals.github.io', 'legend-stories-website'].join('/');
          const ORIGIN = 'https://legendmural.com';
          const extensions = new Set(['.html', '.json', '.mjs', '.js', '.css', '.xml', '.txt', '.toml', '.tsv', '.webmanifest']);
          const skipped = new Set(['.git', 'node_modules', 'dist', 'docs', '.github']);

          async function runtimeFiles(directory = '.') {
            const files = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              if (skipped.has(entry.name)) continue;
              const item = path.join(directory, entry.name);
              if (entry.isDirectory()) files.push(...await runtimeFiles(item));
              else if (extensions.has(path.extname(entry.name))) files.push(item);
            }
            return files;
          }

          test('runtime-facing files no longer publish the GitHub Pages production origin', async () => {
            for (const file of await runtimeFiles()) {
              const source = await readFile(file, 'utf8');
              assert.equal(source.includes(OLD), false, \`legacy production origin remains in \${file}\`);
            }
          });

          test('every managed product canonical is on the canonical production origin', async () => {
            const catalog = JSON.parse(await readFile('data/products/catalog.json', 'utf8'));
            assert.equal(catalog.productCount, 111);
            assert.equal(catalog.products.length, 111);
            for (const product of catalog.products) {
              assert.equal(product.canonical, \`\${ORIGIN}/\${product.page}\`, product.page);
            }
          });

          test('homepage canonical and Open Graph URL use the apex HTTPS origin', async () => {
            const homepage = await readFile('index.html', 'utf8');
            assert.match(homepage, /<link rel="canonical" href="https:\/\/legendmural\.com\/">/);
            assert.match(homepage, /<meta property="og:url" content="https:\/\/legendmural\.com\/">/);
            assert.doesNotMatch(homepage, /http:\/\/legendmural\.com/);
          });

          test('Netlify canonical-host redirects preserve HTTPS apex as the only production host', async () => {
            const config = await readFile('netlify.toml', 'utf8');
            for (const from of [
              'http://legendmural.com/*',
              'http://www.legendmural.com/*',
              'https://www.legendmural.com/*',
              'https://legendmural.netlify.app/*',
            ]) {
              assert.ok(config.includes(\`from = "\${from}"\`), from);
            }
            assert.ok(config.includes('to = "https://legendmural.com/:splat"'));
          });
          `;
          fs.writeFileSync('tests/production-origin-contract.test.mjs', testSource.replace(/^          /gm, ''));
          NODE

      - name: Regenerate managed product pages from migrated catalog
        run: |
          npm run generate:managed-product-pages:live
          npm run generate:runtime-products

      - name: Run full quality gate
        run: npm run quality

      - name: Remove one-off workflow and commit deterministic output
        shell: bash
        run: |
          rm .github/workflows/one-off-production-domain-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No domain migration changes were produced." >&2
            exit 1
          fi
          git commit -m "Migrate storefront production origin to legendmural.com"
          git push origin HEAD:agent/production-domain-legendmural-com
