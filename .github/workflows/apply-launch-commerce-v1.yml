name: Apply launch commerce v1

on:
  push:
    branches:
      - agent/launch-commerce-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-launch-commerce-v1
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-commerce-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply approved launch migration
        run: node scripts/migrate-launch-commerce-v1.mjs

      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Validate variants
        run: npm run validate:product-variants

      - name: Validate catalog
        run: npm run validate:full-catalog

      - name: Validate managed product pages
        run: npm run validate:managed-product-pages:live

      - name: Validate commerce runtime
        run: npm run validate:commerce-runtime

      - name: Validate Stripe checkout
        run: npm run validate:stripe-checkout

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Commit generated migration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply approved launch commerce configuration"
          git push origin HEAD:agent/launch-commerce-v1
