name: Integrate current main into production alignment once

on:
  push:
    branches: [commerce/align-production-30-45-v1]

permissions:
  contents: write

jobs:
  integrate-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Resolve main integration
        run: bash .github/scripts/integrate-main-production.sh
      - name: Install dependencies
        run: npm ci
      - name: Validate production and PayPal integration
        run: |
          node scripts/validate-product-variants.mjs
          node scripts/validate-full-product-catalog.mjs
          node --test tests/production-handoff.test.mjs
          npm run validate:checkout-persistence
          npm run validate:browser-checkout
          npm run validate:commerce-runtime
          npm test
          npm run build
      - name: Commit resolved main integration
        run: |
          git add -A
          git commit -m "Merge PayPal-only main into 30/45 cm production alignment"
          git push origin HEAD:commerce/align-production-30-45-v1
