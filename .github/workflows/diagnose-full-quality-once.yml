name: Diagnose full quality once

on:
  push:
    branches: [commerce/align-production-30-45-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install FFmpeg tooling required by media audits
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version
      - name: Install dependencies
        run: npm ci
      - name: Reproduce pre-test quality state
        shell: bash
        run: |
          set -e
          npm run audit
          npm run audit:css
          npm run audit:dependencies
          npm run audit:media
          npm run audit:media:references
          npm run validate:media-references
          npm run audit:image:metadata
          npm run validate:homepage-marketing-webp
          npm run audit:video:metadata
          npm run validate:video-delivery
          npm run validate:collection-video-loading
          npm run audit:runtime
          npm run audit:inline-handlers
          npm run validate:product-card-navigation
          npm run validate:shared-form-semantics
          npm run validate:dialog-accessibility
          npm run validate:mobile-navigation
          npm run validate:motion-preferences
          npm run validate:cart-controls
          npm run validate:google-places-loader
          npm run validate:runtime-placeholders
          npm run validate:product-variants
          npm run validate:product-image-loading
          npm run validate:image-error-fallbacks
          npm run inventory:products
          npm run validate:full-catalog
          npm run audit:product-page-templates
          npm run generate:managed-product-pages
          npm run validate:managed-product-pages:live
          npm run generate:runtime-products
          npm run validate:runtime-products
          npm run validate:product-browser-derivatives
          npm run validate:related-products
          npm run validate:commerce-runtime
          npm run validate:order-security
          npm run validate:stripe-checkout
          npm run validate:browser-checkout
          npm run validate:order-store
          npm run validate:neon-order-store
          npm run validate:neon-integration
          npm run validate:checkout-persistence
          npm run validate:stripe-webhook
          npm run validate:order-return
          npm run generate:product-previews
          npm run validate:catalog
      - name: Run each Node test file separately
        shell: bash
        run: |
          set +e
          failures=()
          for test_file in tests/*.test.mjs; do
            echo "::group::node --test $test_file"
            node --test "$test_file"
            status=$?
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              echo "::error file=$test_file,title=Node test file failed::$test_file (exit $status)"
              failures+=("$test_file")
            fi
          done
          if [ ${#failures[@]} -ne 0 ]; then
            printf 'Failing Node test files:\n'
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi
          echo 'All individual Node test files passed.'
      - name: Confirm aggregate npm test
        if: success()
        run: npm test
      - name: Confirm build
        if: success()
        run: npm run build
