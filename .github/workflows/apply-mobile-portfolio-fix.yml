name: Apply mobile portfolio fix

on:
  push:
    branches:
      - fix/mobile-portfolio-gallery-overflow
    paths:
      - scripts/apply-mobile-portfolio-fix.mjs
      - .github/workflows/apply-mobile-portfolio-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-portfolio-gallery-overflow
          fetch-depth: 0

      - name: Apply mobile gallery containment
        run: node scripts/apply-mobile-portfolio-fix.mjs

      - name: Remove temporary migration files
        run: rm scripts/apply-mobile-portfolio-fix.mjs .github/workflows/apply-mobile-portfolio-fix.yml

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/skipper.css tests/portfolio-mobile-layout.test.mjs scripts/apply-mobile-portfolio-fix.mjs .github/workflows/apply-mobile-portfolio-fix.yml
          git commit -m "Fix mobile portfolio gallery overflow"
          git push origin HEAD:fix/mobile-portfolio-gallery-overflow
