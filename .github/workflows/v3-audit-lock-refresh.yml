name: V3 audit lock refresh

on:
  push:
    branches:
      - feature/v3-gate3-pdf-renderer-v1-20260902
    paths:
      - .github/workflows/v3-audit-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-audit-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v3-gate3-pdf-renderer-v1-20260902
          fetch-depth: 0
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh vulnerable Browserslist lock entry
        run: npm update browserslist --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already secure"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh Browserslist audit lock entry"
          git push origin HEAD:feature/v3-gate3-pdf-renderer-v1-20260902
