name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove audited orphaned media
        shell: bash
        run: |
          files=(
            "media/welcome/LM Welcome video  mobile   (2).mp4"
            "media/welcome/LM Welcome video  mobile   (4).mp4"
            "media/welcome/LM Welcome video  mobile   (6).mp4"
            "media/Muur/Arnold S.png"
            "media/Muur/Fightclub.png"
            "media/Muur/Ibrahimovic.png"
            "media/Muur/Ice Cube.png"
            "media/Muur/Mike T..png"
            "media/Muur/Tupac_bedroom.png"
          )

          existing=0
          for file in "${files[@]}"; do
            [[ -f "$file" ]] && existing=$((existing + 1))
          done

          if [[ "$existing" -ne 0 && "$existing" -ne "${#files[@]}" ]]; then
            echo "::error::Only $existing of ${#files[@]} audited orphaned files exist; refusing a partial cleanup."
            exit 1
          fi

          if [[ "$existing" -eq "${#files[@]}" ]]; then
            rm -- "${files[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- "${files[@]}"
            git commit -m "perf: remove audited orphaned media"
            git push
          else
            echo "Audited orphaned media is already removed."
          fi

      - name: Run repository audits
        run: |
          npm run audit
          npm run audit:css
          npm run audit:dependencies
          npm run audit:media
          npm run audit:media:references
          npm run validate:media-references
          npm run audit:runtime

      - name: Build product inventory
        run: npm run inventory:products

      - name: Validate full product catalog
        run: npm run validate:full-catalog

      - name: Audit product page template compatibility
        run: npm run audit:product-page-templates

      - name: Generate managed product pages
        run: npm run generate:managed-product-pages

      - name: Validate live managed product pages
        run: npm run validate:managed-product-pages:live

      - name: Generate runtime product registry
        run: npm run generate:runtime-products

      - name: Validate runtime product registry
        run: npm run validate:runtime-products

      - name: Validate related product runtime
        run: npm run validate:related-products

      - name: Validate commerce runtime
        run: npm run validate:commerce-runtime

      - name: Validate authoritative order quotes
        run: npm run validate:order-security

      - name: Validate Stripe test Checkout boundary
        run: npm run validate:stripe-checkout

      - name: Validate browser Checkout integration
        run: npm run validate:browser-checkout

      - name: Validate order store conformance contract
        run: npm run validate:order-store

      - name: Validate Neon order store architecture
        run: npm run validate:neon-order-store

      - name: Validate Neon integration harness
        run: npm run validate:neon-integration

      - name: Validate durable pending Checkout records
        run: npm run validate:checkout-persistence

      - name: Validate signed Stripe webhook boundary
        run: npm run validate:stripe-webhook

      - name: Validate verified order return flow
        run: npm run validate:order-return

      - name: Generate Batch 3 previews
        run: npm run generate:product-previews

      - name: Validate Batch 3 catalog
        run: npm run validate:catalog

      - name: Run unit tests
        run: npm test

      - name: Build Vite multi-page output
        run: npx vite build

      - name: Copy browser runtime files
        run: node scripts/copy-static-js.mjs

      - name: Validate production output
        run: node scripts/validate-build.mjs

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audits
          path: reports/
          if-no-files-found: warn
          retention-days: 14
