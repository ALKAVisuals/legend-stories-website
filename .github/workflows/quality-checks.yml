name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Generate Sprint 2C dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/sprint-2c-build-security'
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit Sprint 2C dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/sprint-2c-build-security'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install dependencies
        run: npm ci

      - name: Run full quality gate
        run: npm run quality

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audits
          path: reports/
          if-no-files-found: warn
          retention-days: 14
