name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository audits
        run: |
          npm run audit
          npm run audit:css
          npm run audit:dependencies
          npm run audit:media
          npm run audit:runtime

      - name: Build product inventory
        run: npm run inventory:products

      - name: Validate full product catalog
        run: npm run validate:full-catalog

      - name: Audit product page template compatibility
        run: npm run audit:product-page-templates

      - name: Generate managed product pages
        run: npm run generate:managed-product-pages

      - name: Validate managed product page previews
        run: npm run validate:managed-product-pages

      - name: Validate live Batch 2 output
        run: node scripts/validate-managed-product-pages.mjs --batch=2026-batch-2 --live

      - name: Validate live Batch 3 output
        run: node scripts/validate-managed-product-pages.mjs --batch=2026-batch-3 --live

      - name: Validate live Batch 4 output
        run: node scripts/validate-managed-product-pages.mjs --batch=2026-batch-4 --live

      - name: Validate live Batch 5 output
        run: node scripts/validate-managed-product-pages.mjs --batch=2026-batch-5 --live

      - name: Validate live Batch 6 output
        run: node scripts/validate-managed-product-pages.mjs --batch=2026-batch-6 --live

      - name: Generate runtime product registry
        run: npm run generate:runtime-products

      - name: Validate runtime product registry
        run: npm run validate:runtime-products

      - name: Validate related product runtime
        run: npm run validate:related-products

      - name: Validate commerce runtime
        run: npm run validate:commerce-runtime

      - name: Generate Batch 3 previews
        run: npm run generate:product-previews

      - name: Validate Batch 3 catalog
        run: npm run validate:catalog

      - name: Run unit tests
        run: npm test

      - name: Build Vite multi-page output
        run: npx vite build

      - name: Copy browser runtime files
        run: node scripts/copy-static-js.mjs

      - name: Validate production output
        run: node scripts/validate-build.mjs

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audits
          path: reports/
          if-no-files-found: warn
          retention-days: 14
