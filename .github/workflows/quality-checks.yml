name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Externalize homepage Swiper and enforce the inline-script gate
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function replaceOnce(path, pattern, replacement, label) {
            const source = readFileSync(path, 'utf8');
            if (typeof replacement === 'string' && source.includes(replacement)) return;
            const matches = source.match(pattern);
            if (!matches) throw new Error(`${path}: ${label} was not found.`);
            if (pattern.global && matches.length !== 1) {
              throw new Error(`${path}: ${label} matched ${matches.length} times.`);
            }
            writeFileSync(path, source.replace(pattern, replacement));
          }

          replaceOnce(
            'index.html',
            /  <!-- Swiper JS -->\n  <script src="https:\/\/cdn\.jsdelivr\.net\/npm\/swiper@11\/swiper-bundle\.min\.js"><\/script>\n  <script>[\s\S]*?document\.addEventListener\('DOMContentLoaded'[\s\S]*?  <\/script>\n<\/body>/,
            '  <!-- Swiper JS -->\n  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>\n  <script src="js/home-swiper.js"></script>\n</body>',
            'homepage inline Swiper block',
          );

          replaceOnce(
            'scripts/runtime-audit.mjs',
            /  if \(inlineExecutableScripts\) warnings\.push\(`\$\{inlineExecutableScripts\} executable inline script blocks remain and require migration before a strict CSP\.`\);/,
            '  if (inlineExecutableScripts) errors.push(`${inlineExecutableScripts} executable inline script blocks are not allowed.`);',
            'inline-script warning contract',
          );
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html scripts/runtime-audit.mjs js/home-swiper.js
          git diff --cached --quiet || git commit -m "refactor: externalize homepage Swiper runtime"
          git push

      - name: Run repository audits
        run: |
          npm run audit
          npm run audit:css
          npm run audit:dependencies
          npm run audit:media
          npm run audit:runtime

      - name: Build product inventory
        run: npm run inventory:products

      - name: Validate full product catalog
        run: npm run validate:full-catalog

      - name: Audit product page template compatibility
        run: npm run audit:product-page-templates

      - name: Generate managed product pages
        run: npm run generate:managed-product-pages

      - name: Validate live managed product pages
        run: npm run validate:managed-product-pages:live

      - name: Generate runtime product registry
        run: npm run generate:runtime-products

      - name: Validate runtime product registry
        run: npm run validate:runtime-products

      - name: Validate related product runtime
        run: npm run validate:related-products

      - name: Validate commerce runtime
        run: npm run validate:commerce-runtime

      - name: Generate Batch 3 previews
        run: npm run generate:product-previews

      - name: Validate Batch 3 catalog
        run: npm run validate:catalog

      - name: Run unit tests
        run: npm test

      - name: Build Vite multi-page output
        run: npx vite build

      - name: Copy browser runtime files
        run: node scripts/copy-static-js.mjs

      - name: Validate production output
        run: node scripts/validate-build.mjs

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audits
          path: reports/
          if-no-files-found: warn
          retention-days: 14
