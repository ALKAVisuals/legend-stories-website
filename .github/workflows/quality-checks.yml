name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Generate Sprint 2C dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/sprint-2c-build-security'
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run full quality gate
        run: npm run quality

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audits
          path: |
            reports/
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
