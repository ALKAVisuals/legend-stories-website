name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture failing unit-test output once on the owned storage branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/v3-pdf-storage-download-20260904'
        run: |
          if [ -f diagnostics/v3-storage-unit-test-output.txt ]; then
            echo "Diagnostic output already captured."
            exit 0
          fi
          set +e
          npm test > /tmp/v3-storage-unit-tests.log 2>&1
          test_code=$?
          set -e
          if [ "$test_code" -eq 0 ]; then
            echo "Unit tests passed during diagnostic capture."
            exit 0
          fi
          mkdir -p diagnostics
          {
            echo "npm test exit code: $test_code"
            echo
            tail -n 1000 /tmp/v3-storage-unit-tests.log
          } > diagnostics/v3-storage-unit-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/v3-storage-unit-test-output.txt
          git commit -m "Temporary: capture V3 storage unit-test failure"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Run repository audits
        run: |
          npm run audit
          npm run audit:css
          npm run audit:dependencies
          npm run audit:media
          npm run audit:media:references
          npm run validate:media-references
          npm run audit:image:metadata
          npm run validate:homepage-marketing-webp
          npm run audit:video:metadata
          npm run validate:video-delivery
          npm run validate:collection-video-loading
          npm run audit:runtime
          npm run audit:inline-handlers
          npm run validate:image-error-fallbacks

      - name: Build product inventory
        run: npm run inventory:products

      - name: Validate full product catalog
        run: npm run validate:full-catalog

      - name: Audit product page template compatibility
        run: npm run audit:product-page-templates

      - name: Generate managed product pages
        run: npm run generate:managed-product-pages

      - name: Validate live managed product pages
        run: npm run validate:managed-product-pages:live

      - name: Generate runtime product registry
        run: npm run generate:runtime-products

      - name: Validate runtime product registry
        run: npm run validate:runtime-products

      - name: Validate related product runtime
        run: npm run validate:related-products

      - name: Validate commerce runtime
        run: npm run validate:commerce-runtime

      - name: Validate authoritative order quotes
        run: npm run validate:order-security

      - name: Validate browser Checkout integration
        run: npm run validate:browser-checkout

      - name: Validate order store conformance contract
        run: npm run validate:order-store

      - name: Validate Neon order store architecture
        run: npm run validate:neon-order-store

      - name: Validate Neon integration harness
        run: npm run validate:neon-integration

      - name: Validate durable pending Checkout records
        run: npm run validate:checkout-persistence

      - name: Validate verified order return flow
        run: npm run validate:order-return

      - name: Generate Batch 3 previews
        run: npm run generate:product-previews

      - name: Validate Batch 3 catalog
        run: npm run validate:catalog

      - name: Run unit tests
        run: npm test

      - name: Build Vite multi-page output
        run: npx vite build

      - name: Copy browser runtime files
        run: node scripts/copy-static-js.mjs

      - name: Validate production output
        run: node scripts/validate-build.mjs

      - name: Upload audit reports on failure only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audits
          path: reports/
          if-no-files-found: warn
          retention-days: 1
