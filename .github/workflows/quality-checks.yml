name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair generator and bootstrap Batch 3 page sources
        run: |
          node scripts/fix-product-page-generation.mjs
          npm run bootstrap:batch3-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/product-page-generation.mjs templates/product-page.html data/products/2026-batch-3-presentation.json
          git diff --cached --quiet || git commit -m "fix: repair Batch 3 page generator"
          git push

      - name: Run repository audits
        run: |
          npm run audit
          npm run audit:css
          npm run audit:dependencies
          npm run audit:media
          npm run audit:runtime

      - name: Build product inventory
        run: npm run inventory:products

      - name: Validate full product catalog
        run: npm run validate:full-catalog

      - name: Generate Batch 3 product pages
        run: npm run generate:batch3-pages

      - name: Validate Batch 3 product pages
        run: npm run validate:batch3-pages

      - name: Generate runtime product registry
        run: npm run generate:runtime-products

      - name: Validate runtime product registry
        run: npm run validate:runtime-products

      - name: Validate related product runtime
        run: npm run validate:related-products

      - name: Validate commerce runtime
        run: npm run validate:commerce-runtime

      - name: Generate Batch 3 previews
        run: npm run generate:product-previews

      - name: Validate Batch 3 catalog
        run: npm run validate:catalog

      - name: Run unit tests
        run: npm test

      - name: Build Vite multi-page output
        run: npx vite build

      - name: Copy browser runtime files
        run: node scripts/copy-static-js.mjs

      - name: Validate production output
        run: node scripts/validate-build.mjs

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audits
          path: reports/
          if-no-files-found: warn
          retention-days: 14
