name: Migrate production sizes once

on:
  push:
    branches: [commerce/align-production-30-45-v1]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      - name: Migrate shared product template
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('templates/product-page.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('value="compact-50x30"', 'value="compact-30"'),
              ('Up to 50 × 30 cm · subtle wall accent', '30 cm longest side · subtle wall accent'),
              ('value="statement-50x50" checked', 'value="statement-45" checked'),
              ('Up to 50 × 50 cm · maximum visual impact', '45 cm longest side · maximum visual impact'),
              ('Each design is scaled to fit within the selected production area. Original proportions are always preserved.',
               'Each design is produced at the selected longest-side size. The other dimension follows the original artwork proportions.'),
              ('Statement · 50 × 50 cm', 'Statement · 45 cm'),
              ('data-variant-id="statement-50x50" data-size-label="50 × 50 cm" data-width-cm="50" data-height-cm="50" data-longest-side-cm="50"',
               'data-variant-id="statement-45" data-size-label="45 cm" data-width-cm="45" data-height-cm="45" data-longest-side-cm="45"'),
              ('Up to 50 × 30 cm or 50 × 50 cm', '30 cm or 45 cm longest side'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one template occurrence for {old!r}; found {count}')
              text = text.replace(old, new)
          legacy = ('compact-50x30', 'statement-50x50', '50 × 30 cm', '50 × 50 cm')
          for token in legacy:
              if token in text:
                  raise SystemExit(f'Legacy production-size token remains in shared template: {token}')
          path.write_text(text, encoding='utf-8')
          print('Shared product template migrated to exact 30/45 cm longest-side sizing.')
          PY

      - name: Generate production-bound catalog
        run: node scripts/generate-full-product-catalog.mjs

      - name: Synchronize presentation manifest template hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          template = Path('templates/product-page.html')
          digest = hashlib.sha256(template.read_bytes()).hexdigest()
          manifests = sorted(Path('data/products').glob('2026-batch-*-presentation.json'))
          if len(manifests) != 6:
              raise SystemExit(f'Expected 6 presentation manifests; found {len(manifests)}')
          for path in manifests:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('template', {}).get('path') != 'templates/product-page.html':
                  raise SystemExit(f'{path}: unexpected template path')
              data['template']['sha256'] = digest
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'Updated {len(manifests)} presentation manifests to template SHA {digest}.')
          PY

      - name: Regenerate all managed product pages
        run: node scripts/generate-managed-product-pages.mjs --write-live

      - name: Rebuild catalog from regenerated live pages
        run: node scripts/generate-full-product-catalog.mjs

      - name: Validate exact production variants and product identity
        run: |
          node scripts/validate-product-variants.mjs
          node scripts/validate-full-product-catalog.mjs
          node --test tests/production-handoff.test.mjs

      - name: Ensure no legacy 50 cm production model remains in managed storefront sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('data/products/catalog.json').read_text(encoding='utf-8'))
          pages = [Path(p['page']) for p in catalog['products']]
          targets = [
              Path('templates/product-page.html'),
              Path('js/commerce/product-variants.mjs'),
              Path('data/products/catalog.json'),
              *pages,
          ]
          forbidden = ('50 × 50 cm', '50 × 30 cm')
          failures = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      failures.append(f'{path}: {token}')
          if failures:
              raise SystemExit('Legacy production-size copy remains:\n' + '\n'.join(failures))
          if len(pages) != 111:
              raise SystemExit(f'Expected 111 managed product pages; found {len(pages)}')
          print('Managed storefront sources contain no legacy 50 cm production-size copy.')
          PY

      - name: Commit regenerated 30/45 cm storefront state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/product-page.html data/products/catalog.json data/products/2026-batch-*-presentation.json '*.html'
          if git diff --cached --quiet; then
            echo "Generated storefront already synchronized."
            exit 0
          fi
          git commit -m "Regenerate storefront for exact 30 and 45 cm production sizes"
          git push origin HEAD:commerce/align-production-30-45-v1
