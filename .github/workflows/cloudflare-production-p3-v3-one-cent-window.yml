name: Cloudflare Production P3 V3 one-cent window

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Enable or disable the temporary controlled P3 one-cent window.'
        required: true
        type: choice
        options:
          - enable
          - disable
      confirm_phrase:
        description: 'Exact confirmation phrase for the selected action.'
        required: true
        type: string
      expected_commit:
        description: 'Exact 40-character main commit SHA approved for this Production change.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-p3-v3-one-cent-window
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply exact temporary P3 V3 one-cent window state
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WINDOW_ACTION: ${{ inputs.action }}
      CONFIRM_PHRASE: ${{ inputs.confirm_phrase }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}

    steps:
      - name: Require exact owner confirmation, main ref and approved commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Refusing to deploy: this workflow may only run from main.'
            exit 1
          fi
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Refusing to deploy: expected_commit must be an exact lowercase 40-character SHA.'
            exit 1
          fi
          if [ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to deploy: approved commit $EXPECTED_COMMIT does not match workflow commit $GITHUB_SHA."
            exit 1
          fi

          case "$WINDOW_ACTION" in
            enable)
              expected_phrase='ENABLE_P3_V3_ONE_CENT_TEST_WINDOW'
              ;;
            disable)
              expected_phrase='DISABLE_P3_V3_ONE_CENT_TEST_WINDOW'
              ;;
            *)
              echo '::error::Refusing to deploy: unsupported action.'
              exit 1
              ;;
          esac

          if [ "$CONFIRM_PHRASE" != "$expected_phrase" ]; then
            echo '::error::Refusing to deploy: confirmation phrase is incorrect for the selected action.'
            exit 1
          fi

      - name: Require established Cloudflare credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Missing CLOUDFLARE_API_TOKEN.'; exit 1; }

      - name: Check out the exact approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact application dependencies
        run: npm ci

      - name: Require repository target state to match selected action
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          const actual = String(config?.env?.production?.vars?.P3_TEST_CHECKOUT_ENABLED || '');
          const expected = process.env.WINDOW_ACTION === 'enable' ? 'true' : 'false';
          if (actual !== expected) {
            throw new Error(`Repository Production P3 target is ${actual || 'missing'}; expected ${expected} for ${process.env.WINDOW_ACTION}.`);
          }
          NODE

      - name: Re-prove P3, V3 and guarded contracts before account mutation
        run: >-
          node --test
          tests/p3-controlled-payment.test.mjs
          tests/cloudflare-config.test.mjs
          tests/cloudflare-v3-paid-finalization-config.test.mjs
          tests/cloudflare-r2-neon-v3-invoice-artifact-binding.test.mjs
          tests/cloudflare-production-p3-window-workflow.test.mjs

      - name: Build storefront static assets
        run: npm run build

      - name: Verify exact existing remote state before mutation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$WINDOW_ACTION" = 'enable' ]; then
            node scripts/verify-cloudflare-production-guarded-update.mjs postdeploy
          else
            node scripts/verify-cloudflare-production-p3-window.mjs
          fi

      - name: Bundle exact Production update without deployment
        run: >-
          npx --yes wrangler@4.129.0 deploy
          --env production
          --dry-run
          --outdir .wrangler-dry-run/production-p3-window

      - name: Deploy exact temporary P3 window state
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: deploy --env production

      - name: Verify exact remote state after deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ "$WINDOW_ACTION" = 'enable' ]; then
            node scripts/verify-cloudflare-production-p3-window.mjs
          else
            node scripts/verify-cloudflare-production-guarded-update.mjs postdeploy
          fi

      - name: Prove checkout gate without creating a PayPal order
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch('https://legendmural.com/api/paypal/checkout', {
            method: 'POST',
            headers: {
              Origin: 'https://legendmural.com',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ request: { items: [] }, customer: {} }),
          });
          const payload = await response.json();

          if (process.env.WINDOW_ACTION === 'enable') {
            if (response.status !== 503 || payload?.error?.code !== 'CHECKOUT_PAUSED') {
              throw new Error(`P3 enable proof failed: expected 503 CHECKOUT_PAUSED, received ${response.status} ${payload?.error?.code || 'no-code'}.`);
            }
            console.log('[cloudflare-production-p3-window] ordinary checkout is fail-closed while P3 is enabled; no PayPal order created.');
          } else {
            if (response.status !== 400 || payload?.error?.code !== 'EMPTY_CART') {
              throw new Error(`P3 disable proof failed: expected 400 EMPTY_CART, received ${response.status} ${payload?.error?.code || 'no-code'}.`);
            }
            console.log('[cloudflare-production-p3-window] ordinary checkout is active after P3 disable; empty-cart proof created no PayPal order.');
          }
          NODE

      - name: Record temporary P3 deployment boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Cloudflare Production P3 V3 one-cent window boundary'
            echo
            echo "- Approved commit: $GITHUB_SHA"
            echo "- Action: $WINDOW_ACTION"
            echo '- Intended Worker: legendmural-cloudflare-production'
            echo '- PayPal Live client intended state: allowed'
            echo '- Production order emails intended state: enabled'
            echo '- V3 Profile-1 creation intended state: enabled'
            echo '- V3 invoice storage intended state: enabled'
            echo '- V3 invoice reconciliation intended state: enabled'
            echo '- V3 dashboard invoice API intended state: disabled'
            echo '- P3 token value printed or committed: no'
            echo '- Automatic PayPal order created by workflow: no'
            echo '- DNS/custom-domain commands: none'
            echo '- Netlify Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
