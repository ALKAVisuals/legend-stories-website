name: PR 207 regenerate product contact identity

on:
  push:
    branches:
      - fix/legendmural-customer-email-20260905

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/legendmural-customer-email-20260905
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update canonical product contact identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const oldEmail = 'info@alkavisuals.nl';
          const newEmail = 'info@legendmural.com';
          const templatePath = 'templates/product-page.html';
          const canonicalFiles = [
            templatePath,
            'scripts/product-page-generation.mjs',
            'tests/gpsr-product-identity-contract.test.mjs',
          ];

          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const oldTemplate = fs.readFileSync(templatePath, 'utf8');
          const oldTemplateHash = sha256(oldTemplate);

          for (const file of canonicalFiles) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(oldEmail)) {
              throw new Error(`Expected ${oldEmail} in ${file}.`);
            }
            source = source.split(oldEmail).join(newEmail);
            fs.writeFileSync(file, source);
          }

          const newTemplateHash = sha256(fs.readFileSync(templatePath, 'utf8'));

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(target) : [target];
            });
          }

          let manifestFilesUpdated = 0;
          for (const file of walk('data').filter((entry) => entry.endsWith('.json'))) {
            const raw = fs.readFileSync(file, 'utf8');
            if (!raw.includes(oldTemplateHash)) continue;
            fs.writeFileSync(file, raw.split(oldTemplateHash).join(newTemplateHash));
            manifestFilesUpdated += 1;
          }

          if (manifestFilesUpdated !== 6) {
            throw new Error(`Expected 6 presentation manifests using ${oldTemplateHash}; updated ${manifestFilesUpdated}.`);
          }

          console.log(`Updated product contact identity and ${manifestFilesUpdated} presentation manifests.`);
          console.log(`Template hash: ${oldTemplateHash} -> ${newTemplateHash}`);
          NODE

      - name: Regenerate all managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Create local validation commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr207-regenerate-product-contact.yml
          git add -A
          git diff --cached --check
          git commit -m "Regenerate LegendMural product contact identity"

      - name: Check stale email is absent from customer-facing source
        shell: bash
        run: |
          if git grep -n -I "info@alkavisuals.nl" -- '*.html' 'js' 'server' 'netlify/functions'; then
            echo "Stale customer-facing contact email remains."
            exit 1
          fi

      - name: Run targeted contact and GPSR tests
        run: node --test tests/customer-contact-email.test.mjs tests/gpsr-product-identity-contract.test.mjs

      - name: Validate managed product pages
        run: npm run validate:managed-product-pages:live

      - name: Push validated generated commit
        run: git push origin HEAD:fix/legendmural-customer-email-20260905
