name: Temporary PR 54 main synchronization

on:
  push:
    branches:
      - agent/cart-control-delegation
    paths:
      - .github/workflows/temporary-cart-control-main-sync.yml

permissions:
  contents: write

jobs:
  sync-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/cart-control-delegation
          fetch-depth: 0

      - name: Merge latest main with guarded conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "Merge failed without resolvable conflicts."
              exit 1
            fi
            for path in "${conflicts[@]}"; do
              case "$path" in
                js/app.js|package.json)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path"
                  exit 1
                  ;;
              esac
            done
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain."
            exit 1
          fi
          git commit -m "Merge latest main into cart-control branch"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run complete quality gate
        run: npm run quality

      - name: Remove temporary workflow and push validated branch
        shell: bash
        run: |
          rm .github/workflows/temporary-cart-control-main-sync.yml
          git add -A
          git commit -m "Revalidate cart controls on latest main"
          git push origin HEAD:agent/cart-control-delegation
