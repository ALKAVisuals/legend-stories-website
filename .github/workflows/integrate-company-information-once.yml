name: Integrate company information one-off

on:
  push:
    branches:
      - agent/legal-customer-operations-v2
    paths:
      - .github/workflows/integrate-company-information-once.yml
      - scripts/integrate-company-information-once.mjs

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Integrate company information
        run: node scripts/integrate-company-information-once.mjs
      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live
      - name: Validate company information integration
        run: |
          grep -q 'KvK 95153756' company.html
          grep -q 'NL867022346B01' company.html
          grep -q '+31 6 49 24 04 12' company.html
          grep -q 'href="company.html"' index.html
          grep -q 'href="company.html"' templates/product-page.html
          grep -q 'Alka Group, trading through LegendMural' returns.html
          npm run validate:managed-product-pages:live
          git diff --check
      - name: Full quality gate
        run: npm run quality
      - name: Commit only after all gates pass
        run: |
          git config user.name "legendmural-legal-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/integrate-company-information-once.yml scripts/integrate-company-information-once.mjs
          git commit -m "Integrate confirmed Alka Group company information"
          git push origin HEAD:agent/legal-customer-operations-v2
