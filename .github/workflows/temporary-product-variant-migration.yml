name: Temporary product variant migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: product-variant-migration
  cancel-in-progress: true

jobs:
  migrate-validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/product-size-variants
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble and verify migration
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/product-variant-migration.00.part \
              scripts/product-variant-migration.01.part \
              scripts/product-variant-migration.02.part \
              > scripts/migrate-product-variants.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate-product-variants.mjs')
          source = path.read_text()
          marker = 'function newStructuredDataFunction() {'
          first = source.index(marker)
          second = source.index(marker, first + 1)
          source = source[:first] + source[second:]
          source = source.replace(r"].join('\\n');", r"].join('\n');")
          path.write_text(source)
          PY
          node --check scripts/migrate-product-variants.mjs

      - name: Apply product variants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate-product-variants.mjs
          python - <<'PY'
          import json
          from pathlib import Path

          generator = Path('scripts/product-page-generation.mjs')
          source = generator.read_text()
          for before, after in (
              (r'\\s', r'\s'),
              (r'\\S', r'\S'),
              (r'\\/', r'\/'),
              (r'\\b', r'\b'),
              (r'\\n', r'\n'),
          ):
              source = source.replace(before, after)
          generator.write_text(source)

          for batch in range(1, 7):
              path = Path(f'data/products/2026-batch-{batch}-presentation.json')
              manifest = json.loads(path.read_text())
              for product in manifest.get('products', []):
                  product.pop('compareAtPrice', None)
                  product.pop('discountLabel', None)
              path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          full_catalog = json.loads(Path('data/products/catalog.json').read_text())
          full_by_page = {product['page']: product for product in full_catalog['products']}
          batch_path = Path('data/products/2026-batch-3.json')
          batch_catalog = json.loads(batch_path.read_text())
          batch_catalog['schemaVersion'] = 2
          batch_catalog['variantPolicy'] = full_catalog['variantPolicy']
          for product in batch_catalog['products']:
              source_product = full_by_page[product['page']]
              for field in (
                  'description',
                  'price',
                  'fromPrice',
                  'defaultVariantId',
                  'variants',
              ):
                  product[field] = source_product[field]
          batch_path.write_text(json.dumps(batch_catalog, indent=2, ensure_ascii=False) + '\n')
          PY
          node --check scripts/product-page-generation.mjs
          npm run generate:managed-product-pages:live

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run complete quality gate
        shell: bash
        run: |
          set +e
          npm run quality > /tmp/product-variant-quality.log 2>&1
          quality_status=$?
          set -e
          if [ "$quality_status" -ne 0 ]; then
            tail -n 320 /tmp/product-variant-quality.log > product-variant-quality-diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add product-variant-quality-diagnostic.txt
            git commit -m "Record product variant quality diagnostic"
            git push origin HEAD:feat/product-size-variants
            exit "$quality_status"
          fi
          cat /tmp/product-variant-quality.log

      - name: Publish validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f product-variant-quality-diagnostic.txt
          rm scripts/migrate-product-variants.mjs
          rm scripts/product-variant-migration.00.part
          rm scripts/product-variant-migration.01.part
          rm scripts/product-variant-migration.02.part
          rm .github/workflows/temporary-product-variant-migration.yml
          git add -A
          git commit -m "Implement 30 cm and 45 cm product variants"
          git push origin HEAD:feat/product-size-variants
