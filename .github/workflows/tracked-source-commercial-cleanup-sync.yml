name: Tracked-source commercial cleanup sync

on:
  push:
    branches:
      - website/tracked-source-commercial-cleanup-20260904

permissions:
  contents: write

jobs:
  normalize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize tracked storefront commercial source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const indexPath = 'index.html';
          const shopPath = 'shop.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          let shop = fs.readFileSync(shopPath, 'utf8');

          function replaceAllLogged(source, from, to, label, { required = true } = {}) {
            const count = source.split(from).length - 1;
            if (required && count === 0) throw new Error(`${label}: expected source marker not found`);
            if (count > 0) console.log(`${label}: ${count}`);
            return source.split(from).join(to);
          }

          function normalizeLegacyVariantButtons(source, pageLabel) {
            let statementCount = 0;
            let compactCount = 0;
            source = source.replace(/<button\b[^>]*\bdata-variant-id="(?:statement-50x50|compact-50x30)"[^>]*>/g, (tag) => {
              if (tag.includes('data-variant-id="statement-50x50"')) {
                statementCount += 1;
                return tag
                  .replace('data-variant-id="statement-50x50"', 'data-variant-id="statement-45"')
                  .replace('data-size-label="50 × 50 cm"', 'data-size-label="45 cm"')
                  .replace('data-width-cm="50"', 'data-width-cm="45"')
                  .replace('data-height-cm="50"', 'data-height-cm="45"')
                  .replace('data-longest-side-cm="50"', 'data-longest-side-cm="45"');
              }
              compactCount += 1;
              return tag
                .replace('data-variant-id="compact-50x30"', 'data-variant-id="compact-30"')
                .replace('data-size-label="50 × 30 cm"', 'data-size-label="30 cm"')
                .replace(/data-width-cm="(?:50|30)"/, 'data-width-cm="30"')
                .replace(/data-height-cm="(?:50|30)"/, 'data-height-cm="30"')
                .replace(/data-longest-side-cm="50"/, 'data-longest-side-cm="30"');
            });
            console.log(`${pageLabel}: normalized ${statementCount} Statement legacy buttons and ${compactCount} Compact legacy buttons`);
            return source;
          }

          // Match the already-approved production-build commercial wording in tracked source.
          index = replaceAllLogged(index, '€49,95', 'From €35', 'index legacy €49,95 price');
          index = replaceAllLogged(
            index,
            'Drag the slider. See what a €49 sticker does to a blank wall.',
            'Drag the slider. See what a LegendMural sticker does to a blank wall.',
            'index before/after legacy price copy',
          );
          index = replaceAllLogged(
            index,
            '<h3 class="font-display font-bold text-sm mb-1">Fast shipping</h3><p class="text-text-secondary text-xs leading-relaxed">2 to 4 working days. Ships across Europe.</p>',
            '<h3 class="font-display font-bold text-sm mb-1">Ships from NL</h3><p class="text-text-secondary text-xs leading-relaxed">Available to the Netherlands, supported EU destinations and the United States.</p>',
            'index fast-shipping legacy block',
            { required: false },
          );
          index = replaceAllLogged(
            index,
            'Your mural gets printed on matte vinyl and lands at your door in 2 to 4 days.',
            'Your mural is printed on matte vinyl and prepared for shipment from the Netherlands.',
            'index fixed-delivery legacy copy',
          );
          index = normalizeLegacyVariantButtons(index, 'index.html');

          shop = replaceAllLogged(
            shop,
            'Free shipping over €50. Standard delivery in 2 to 4 working days across Europe.',
            'Free shipping from €69 after discount. Netherlands €4,95 · EU €9,95 · United States €9,95 tracked.',
            'shop legacy shipping copy',
          );
          shop = replaceAllLogged(
            shop,
            '30 day return window. Not happy? Send it back for a full refund.',
            'Standard catalogue purchases generally have a 14-day statutory withdrawal period. See Returns for the full process.',
            'shop legacy return copy',
          );
          shop = normalizeLegacyVariantButtons(shop, 'shop.html');

          const forbidden = [
            ['legacy €49/€49,95 source price', /€49(?:,95)?/i],
            ['fixed 2–4-day delivery range', /\b2\s*(?:to|-|–|—)\s*4\s*(?:working\s+)?days?\b/i],
            ['old €50 free-shipping threshold', /Free shipping over €50/i],
            ['old 30-day return promise', /30 day return window/i],
            ['legacy Statement variant id', /statement-50x50/i],
            ['legacy Compact variant id', /compact-50x30/i],
            ['legacy 50 × 50 size label', /50\s*×\s*50\s*cm/i],
            ['legacy 50 × 30 size label', /50\s*×\s*30\s*cm/i],
          ];

          for (const [page, source] of [['index.html', index], ['shop.html', shop]]) {
            for (const [label, pattern] of forbidden) {
              if (pattern.test(source)) throw new Error(`${page}: ${label} remains after normalization`);
            }
          }

          if (!index.includes('From €35')) throw new Error('index.html: current starting-price context missing');
          if (!index.includes('data-variant-id="statement-45"')) throw new Error('index.html: canonical Statement 45 variant missing');
          if (!shop.includes('Free shipping from €69 after discount.')) throw new Error('shop.html: current free-shipping rule missing');
          if (!shop.includes('14-day statutory withdrawal period')) throw new Error('shop.html: current withdrawal summary missing');
          if (!shop.includes('data-variant-id="statement-45"')) throw new Error('shop.html: canonical Statement 45 variant missing');

          fs.writeFileSync(indexPath, index);
          fs.writeFileSync(shopPath, shop);

          const test = `import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { rewriteLaunchCommercialCopy } from '../scripts/vite-launch-commercial-copy-plugin.mjs';

          const index = await readFile(new URL('../index.html', import.meta.url), 'utf8');
          const shop = await readFile(new URL('../shop.html', import.meta.url), 'utf8');
          const variants = await readFile(new URL('../js/commerce/product-variants.mjs', import.meta.url), 'utf8');

          const forbidden = [
            /€49(?:,95)?/i,
            /\\b2\\s*(?:to|-|–|—)\\s*4\\s*(?:working\\s+)?days?\\b/i,
            /Free shipping over €50/i,
            /30 day return window/i,
            /statement-50x50/i,
            /compact-50x30/i,
            /50\\s*×\\s*50\\s*cm/i,
            /50\\s*×\\s*30\\s*cm/i,
          ];

          test('tracked homepage source already expresses current launch commercial rules', () => {
            for (const pattern of forbidden) assert.doesNotMatch(index, pattern);
            assert.match(index, /From €35/);
            assert.match(index, /data-price="45" data-variant-id="statement-45" data-size-label="45 cm"/);
            assert.match(index, /prepared for shipment from the Netherlands/i);
            assert.equal(rewriteLaunchCommercialCopy(index, { path: '/' }), index, 'production build must not need to rewrite homepage commercial copy');
          });

          test('tracked shop source already expresses current launch commercial rules', () => {
            for (const pattern of forbidden) assert.doesNotMatch(shop, pattern);
            assert.match(shop, /Free shipping from €69 after discount\./);
            assert.match(shop, /14-day statutory withdrawal period/);
            assert.match(shop, /From €35/);
            assert.match(shop, /data-price="45" data-variant-id="statement-45" data-size-label="45 cm"/);
            assert.equal(rewriteLaunchCommercialCopy(shop, { path: '/shop.html' }), shop, 'production build must not need to rewrite shop commercial copy');
          });

          test('legacy variant aliases remain only as runtime backwards compatibility', () => {
            assert.match(variants, /'statement-50x50': 'statement-45'/);
            assert.match(variants, /'compact-50x30': 'compact-30'/);
          });
          `;
          fs.writeFileSync('tests/tracked-source-commercial-contract.test.mjs', test.replace(/^          /gm, ''));
          NODE

      - name: Run focused source contract
        run: node --test tests/tracked-source-commercial-contract.test.mjs

      - name: Commit normalized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html shop.html tests/tracked-source-commercial-contract.test.mjs
          git diff --cached --check
          git commit -m "Storefront: normalize tracked commercial source [skip ci]"
          git push
