name: Patch shipping copy

on:
  push:
    branches:
      - feat/launch-shipping-rates

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/launch-shipping-rates
          fetch-depth: 0

      - name: Update cart copy and its contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_copy = 'Shipping within the Netherlands is €4,95 and free from €69. United States shipping opens after tracked rates and import charges are confirmed.'
          new_copy = 'Shipping is €4,95 within the Netherlands and €9,95 to the EU and United States. Free shipping from €69.'
          if app.count(old_copy) != 1:
              raise SystemExit(f'Expected one stale shipping message, found {app.count(old_copy)}')
          app_path.write_text(app.replace(old_copy, new_copy), encoding='utf-8')

          test_path = Path('tests/shipping-checkout-ui-contract.test.mjs')
          test_source = test_path.read_text(encoding='utf-8')
          old_title = "test('cart and checkout explain the staged United States rollout without emoji flags', () => {"
          new_title = "test('cart explains the active launch shipping rates without emoji flags', () => {"
          old_assertion = "  assert.match(app, /United States shipping opens after tracked rates and import charges are confirmed/);"
          new_assertions = "  assert.match(app, /€9,95 to the EU and United States/);\n  assert.doesNotMatch(app, /United States shipping opens/);"
          if test_source.count(old_title) != 1 or test_source.count(old_assertion) != 1:
              raise SystemExit('Expected shipping UI contract text was not found exactly once')
          test_source = test_source.replace(old_title, new_title).replace(old_assertion, new_assertions)
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/patch-shipping-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js tests/shipping-checkout-ui-contract.test.mjs .github/workflows/patch-shipping-copy.yml
          git commit -m "fix: show active shipping rates in cart"
          git push origin HEAD:feat/launch-shipping-rates
