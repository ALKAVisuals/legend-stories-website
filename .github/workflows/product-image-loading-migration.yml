name: Apply product image loading contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-image-loading-migration.yml
      - scripts/migrate-product-image-loading.mjs
      - scripts/validate-product-image-loading.mjs

permissions:
  contents: write

concurrency:
  group: product-image-loading-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.ref == 'agent/product-image-loading' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-image-loading
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Apply bounded loading migration
        run: node scripts/migrate-product-image-loading.mjs

      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Validate product image loading
        run: npm run validate:product-image-loading

      - name: Run complete repository quality gate
        run: npm run quality

      - name: Remove temporary migration tooling
        run: git rm .github/workflows/product-image-loading-migration.yml scripts/migrate-product-image-loading.mjs

      - name: Commit validated loading contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize product image loading"
          git push origin HEAD:agent/product-image-loading
