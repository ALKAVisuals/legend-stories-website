name: Temporary social image policy fix

on:
  push:
    branches:
      - agent/product-browser-derivatives
    paths:
      - .github/workflows/temporary-social-image-policy-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-browser-derivatives
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply guarded migration
        run: node scripts/temporary-fix-social-image-policy.mjs

      - name: Regenerate managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Regenerate runtime product registry
        run: npm run generate:runtime-products

      - name: Run full quality gate
        run: npm run quality

      - name: Remove temporary migration files
        run: |
          rm scripts/temporary-fix-social-image-policy.mjs
          rm .github/workflows/temporary-social-image-policy-fix.yml

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No validated changes to commit."; exit 1; }
          git commit -m "Keep social previews on original product images"
          git push origin HEAD:agent/product-browser-derivatives
