name: Temporary premium size selector migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: premium-size-selector-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-selector:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align migration with current regression contract
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'scripts/apply-premium-size-selector.mjs';
          let source = await readFile(file, 'utf8');
          const current = `  assert.match(templateSource, /data-variant-badge/);
            assert.match(templateSource, /flex shrink-0 flex-col items-end gap-2/);`;
          const aligned = `  assert.match(templateSource, /data-variant-badge/);
            assert.match(templateSource, /data-variant-price[^>]*>€45/);
            assert.match(templateSource, /flex shrink-0 flex-col items-end gap-2/);`;
          if (source.includes(current)) {
            source = source.replace(current, aligned);
            await writeFile(file, source);
          } else if (!source.includes('data-variant-price[^>]*>€45')) {
            throw new Error('Could not align the migration with the current regression contract.');
          }
          NODE

      - name: Apply premium size selector
        run: node scripts/apply-premium-size-selector.mjs

      - name: Regenerate all managed product pages
        run: npm run generate:managed-product-pages:live

      - name: Validate selector and generated pages
        run: |
          npm run validate:product-variants
          npm run audit:product-page-templates
          npm run validate:managed-product-pages:live
          npm test
          npm run build

      - name: Remove temporary migration files
        run: |
          rm scripts/apply-premium-size-selector.mjs
          rm .github/workflows/temporary-premium-size-selector.yml

      - name: Commit materialized selector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Redesign premium product size selector"
          git push origin HEAD:${TARGET_BRANCH}
