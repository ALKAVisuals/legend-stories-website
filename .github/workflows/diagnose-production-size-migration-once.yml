name: Diagnose production size migration once

on:
  push:
    branches: [commerce/align-production-30-45-v1]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Locate legacy 50 cm production assumptions
        run: |
          set +e
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' \
            'statement-50x50|compact-50x30|50 × 50 cm|50 × 30 cm|50x50|50x30|sizeCm[^\n]*50|longestSideCm[^\n]*50' \
            templates scripts server js tests data/products *.html > /tmp/legacy-production-size-references.txt
          code=$?
          cat /tmp/legacy-production-size-references.txt
          count=$(wc -l < /tmp/legacy-production-size-references.txt)
          echo "LEGACY_REFERENCE_LINES=${count}"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Compile changed server and generator modules
        run: |
          node --check js/commerce/product-variants.mjs
          node --check scripts/production-identity.mjs
          node --check scripts/generate-full-product-catalog.mjs
          node --check scripts/product-page-generation.mjs
          node --check scripts/validate-product-variants.mjs
          node --check scripts/validate-full-product-catalog.mjs
          node --check server/commerce/order-quote.mjs
          node --check server/orders/checkout-persistence.mjs
          node --check server/orders/production-handoff.mjs
      - name: Run production handoff test
        run: node --test tests/production-handoff.test.mjs
