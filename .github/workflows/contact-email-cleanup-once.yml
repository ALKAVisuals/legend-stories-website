name: One-shot contact email cleanup

on:
  push:
    branches:
      - fix/contact-email-legendmural

permissions:
  contents: write

jobs:
  replace-contact-email:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/contact-email-legendmural

      - name: Replace stale contact email
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'hello@legendstories.nl'
          new = 'info@legendmural.com'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale contact email, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use LegendMural contact email in source"
          git push origin HEAD:fix/contact-email-legendmural
