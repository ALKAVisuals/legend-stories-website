name: Netlify preview compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/netlify-preview-compatibility.yml'
      - 'netlify.toml'
      - 'netlify/functions/**'
      - 'server/netlify/**'
      - 'server/api/**'
      - 'server/adapters/neon-order-store.mjs'
      - 'js/commerce/**'
      - 'js/order-return.js'
      - 'order-success.html'
      - 'scripts/generate-commerce-runtime-config.mjs'
      - 'scripts/validate-browser-checkout.mjs'
      - 'scripts/validate-order-return.mjs'
      - 'tests/commerce-runtime-config.test.mjs'
      - 'tests/netlify-commerce-runtime.test.mjs'
      - 'tests/netlify-commerce-config.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/netlify-preview-compatibility.yml'
      - 'netlify.toml'
      - 'netlify/functions/**'
      - 'server/netlify/**'
      - 'server/api/**'
      - 'server/adapters/neon-order-store.mjs'
      - 'js/commerce/**'
      - 'js/order-return.js'
      - 'order-success.html'
      - 'scripts/generate-commerce-runtime-config.mjs'
      - 'scripts/validate-browser-checkout.mjs'
      - 'scripts/validate-order-return.mjs'
      - 'tests/commerce-runtime-config.test.mjs'
      - 'tests/netlify-commerce-runtime.test.mjs'
      - 'tests/netlify-commerce-config.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-preview-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node 22 commerce preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate checkout boundaries
        run: |
          npm run validate:browser-checkout
          npm run validate:order-return

      - name: Run Netlify commerce tests
        run: |
          node --test \
            tests/commerce-runtime-config.test.mjs \
            tests/netlify-commerce-runtime.test.mjs \
            tests/netlify-commerce-config.test.mjs

      - name: Build storefront
        run: npm run build

      - name: Generate Netlify public runtime config
        env:
          LEGENDMURAL_HOSTED_CHECKOUT_ENDPOINT: /api/paypal/checkout
          LEGENDMURAL_ORDER_STATUS_ENDPOINT: /api/order-status
          LEGENDMURAL_PAYPAL_CAPTURE_ENDPOINT: /api/paypal/capture
        run: node scripts/generate-commerce-runtime-config.mjs

      - name: Verify generated runtime routes and payment return wiring
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const { COMMERCE_RUNTIME_CONFIG } = await import('./dist/js/commerce/runtime-config.mjs');
          if (COMMERCE_RUNTIME_CONFIG.hostedCheckoutEndpoint !== '/api/paypal/checkout') {
            throw new Error('Generated PayPal checkout route is invalid.');
          }
          if (COMMERCE_RUNTIME_CONFIG.orderStatusEndpoint !== '/api/order-status') {
            throw new Error('Generated order-status route is invalid.');
          }
          if (COMMERCE_RUNTIME_CONFIG.paypalCaptureEndpoint !== '/api/paypal/capture') {
            throw new Error('Generated PayPal capture route is invalid.');
          }

          const returnPage = await readFile('./dist/order-success.html', 'utf8');
          const runtimeReturnScript = /<script\b(?=[^>]*\btype=["']module["'])(?=[^>]*\bsrc=["']\/js\/order-return\.js["'])[^>]*>\s*<\/script>/i;
          if (!runtimeReturnScript.test(returnPage)) {
            throw new Error('Built payment return page is not loading the unbundled runtime order-return module.');
          }
          if (/assets\/order-success-[^"']+\.js/.test(returnPage)) {
            throw new Error('Payment return page incorrectly bundled deployment-generated commerce config into a Vite asset.');
          }
          NODE
