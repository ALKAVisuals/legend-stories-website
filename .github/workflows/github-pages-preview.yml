name: Temporary GitHub Pages preview

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static preview with the normal production build
        run: npm run build

      - name: Rewrite root URLs for the GitHub Pages subpath
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile, stat, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const root = 'dist';
          const extensions = new Set(['.html', '.json', '.js', '.css']);
          const replacements = [
            ['/assets/', '/legend-stories-website/assets/', 'assets'],
            ['/css/checkout-controls.css', '/legend-stories-website/css/checkout-controls.css', 'checkout controls'],
            ['/css/footer-theme.css', '/legend-stories-website/css/footer-theme.css', 'footer theme'],
            ['/js/contact-form.js', '/legend-stories-website/js/contact-form.js', 'contact form'],
          ];
          const counts = Object.fromEntries(replacements.map(([, , label]) => [label, 0]));
          let changedFiles = 0;

          async function walk(dir) {
            for (const name of await readdir(dir)) {
              const path = join(dir, name);
              const info = await stat(path);
              if (info.isDirectory()) {
                await walk(path);
                continue;
              }
              const dot = name.lastIndexOf('.');
              const extension = dot >= 0 ? name.slice(dot) : '';
              if (!extensions.has(extension)) continue;

              const original = await readFile(path, 'utf8');
              let updated = original;
              let changed = false;

              for (const [from, to, label] of replacements) {
                const matches = updated.split(from).length - 1;
                if (!matches) continue;
                updated = updated.replaceAll(from, to);
                counts[label] += matches;
                changed = true;
              }

              if (!changed) continue;
              await writeFile(path, updated, 'utf8');
              changedFiles += 1;
            }
          }

          await walk(root);
          console.log(`Rewrote preview root URLs across ${changedFiles} built file(s): ${JSON.stringify(counts)}.`);
          for (const label of ['assets', 'checkout controls', 'footer theme', 'contact form']) {
            if (counts[label] === 0) {
              throw new Error(`Expected at least one root URL for ${label} in the built preview.`);
            }
          }
          EOF

      - name: Verify GitHub Pages asset paths
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile, stat } from 'node:fs/promises';
          import { join } from 'node:path';

          const root = 'dist';
          const extensions = new Set(['.html', '.json', '.js', '.css']);
          const unresolved = [];
          const patterns = [
            ['assets', /(^|["'(`=:,\s])\/assets\//m],
            ['checkout controls', /(^|["'(`=:,\s])\/css\/checkout-controls\.css/m],
            ['footer theme', /(^|["'(`=:,\s])\/css\/footer-theme\.css/m],
            ['contact form', /(^|["'(`=:,\s])\/js\/contact-form\.js/m],
          ];

          async function walk(dir) {
            for (const name of await readdir(dir)) {
              const path = join(dir, name);
              const info = await stat(path);
              if (info.isDirectory()) {
                await walk(path);
                continue;
              }
              const dot = name.lastIndexOf('.');
              const extension = dot >= 0 ? name.slice(dot) : '';
              if (!extensions.has(extension)) continue;
              const text = await readFile(path, 'utf8');
              for (const [label, pattern] of patterns) {
                if (pattern.test(text)) unresolved.push(`${label}: ${path}`);
              }
            }
          }

          await walk(root);
          if (unresolved.length) {
            console.error('Found unresolved root URLs:');
            unresolved.slice(0, 30).forEach((entry) => console.error(`- ${entry}`));
            process.exit(1);
          }

          const index = await readFile('dist/index.html', 'utf8');
          const expected = [
            '/legend-stories-website/assets/',
            '/legend-stories-website/css/checkout-controls.css',
            '/legend-stories-website/css/footer-theme.css',
            '/legend-stories-website/js/contact-form.js',
          ];
          for (const path of expected) {
            if (!index.includes(path)) throw new Error(`index.html is missing expected GitHub Pages path: ${path}`);
          }
          console.log('GitHub Pages asset-path verification passed.');
          EOF

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
