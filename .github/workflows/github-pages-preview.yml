name: Temporary GitHub Pages preview

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static preview with the normal production build
        run: npm run build

      - name: Rewrite root URLs for the GitHub Pages subpath
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile, stat, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const root = 'dist';
          const extensions = new Set(['.html', '.json', '.js', '.css']);
          let changedFiles = 0;
          let assetReplacements = 0;
          let footerThemeReplacements = 0;

          async function walk(dir) {
            for (const name of await readdir(dir)) {
              const path = join(dir, name);
              const info = await stat(path);
              if (info.isDirectory()) {
                await walk(path);
                continue;
              }
              const dot = name.lastIndexOf('.');
              const extension = dot >= 0 ? name.slice(dot) : '';
              if (!extensions.has(extension)) continue;

              const original = await readFile(path, 'utf8');
              const assetMatches = original.match(/\/assets\//g) || [];
              const footerMatches = original.match(/\/css\/footer-theme\.css/g) || [];
              if (!assetMatches.length && !footerMatches.length) continue;

              const updated = original
                .replaceAll('/assets/', '/legend-stories-website/assets/')
                .replaceAll('/css/footer-theme.css', '/legend-stories-website/css/footer-theme.css');

              await writeFile(path, updated, 'utf8');
              changedFiles += 1;
              assetReplacements += assetMatches.length;
              footerThemeReplacements += footerMatches.length;
            }
          }

          await walk(root);
          console.log(`Rewrote ${assetReplacements} root asset URL(s) and ${footerThemeReplacements} footer theme URL(s) across ${changedFiles} built file(s).`);
          if (assetReplacements === 0) {
            throw new Error('Expected at least one root /assets/ URL in the built preview.');
          }
          if (footerThemeReplacements === 0) {
            throw new Error('Expected at least one root /css/footer-theme.css URL in the built preview.');
          }
          EOF

      - name: Verify GitHub Pages asset paths
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile, stat } from 'node:fs/promises';
          import { join } from 'node:path';

          const root = 'dist';
          const extensions = new Set(['.html', '.json', '.js', '.css']);
          const unresolvedAssets = [];
          const unresolvedFooterTheme = [];
          const rootAssetPattern = /(^|["'(`=:,\s])\/assets\//m;
          const rootFooterThemePattern = /(^|["'(`=:,\s])\/css\/footer-theme\.css/m;

          async function walk(dir) {
            for (const name of await readdir(dir)) {
              const path = join(dir, name);
              const info = await stat(path);
              if (info.isDirectory()) {
                await walk(path);
                continue;
              }
              const dot = name.lastIndexOf('.');
              const extension = dot >= 0 ? name.slice(dot) : '';
              if (!extensions.has(extension)) continue;
              const text = await readFile(path, 'utf8');
              if (rootAssetPattern.test(text)) unresolvedAssets.push(path);
              if (rootFooterThemePattern.test(text)) unresolvedFooterTheme.push(path);
            }
          }

          await walk(root);
          if (unresolvedAssets.length) {
            console.error('Found unresolved root /assets/ URLs:');
            unresolvedAssets.slice(0, 20).forEach((path) => console.error(`- ${path}`));
            process.exit(1);
          }
          if (unresolvedFooterTheme.length) {
            console.error('Found unresolved root footer-theme.css URLs:');
            unresolvedFooterTheme.slice(0, 20).forEach((path) => console.error(`- ${path}`));
            process.exit(1);
          }

          const index = await readFile('dist/index.html', 'utf8');
          if (!index.includes('/legend-stories-website/assets/')) {
            throw new Error('index.html does not contain the expected GitHub Pages asset prefix.');
          }
          if (!index.includes('/legend-stories-website/css/footer-theme.css')) {
            throw new Error('index.html does not contain the expected GitHub Pages footer theme path.');
          }
          console.log('GitHub Pages asset-path verification passed.');
          EOF

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
