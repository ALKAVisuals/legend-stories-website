name: Remove unverified testimonials v2 one-off

on:
  push:
    branches:
      - agent/legal-customer-operations-v2
    paths:
      - .github/workflows/remove-unverified-testimonials-v2-once.yml
      - scripts/remove-unverified-testimonials-once.mjs

permissions:
  contents: write

jobs:
  remove-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Remove unverified testimonial section
        run: node scripts/remove-unverified-testimonials-once.mjs
      - name: Verify testimonial claims are absent
        run: |
          ! grep -Eiq 'Rik van Dijk|Pieter Bakker|Anna de Wit|Jonas Peeters|testimonial-dot|testimonial-track' index.html
          npm run validate:shared-form-semantics
          git diff --check
      - name: Full quality gate
        run: npm run quality
      - name: Commit only after all gates pass
        run: |
          git config user.name "legendmural-legal-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/validate-shared-form-semantics.mjs
          git commit -m "Remove unverified customer testimonials"
          git push origin HEAD:agent/legal-customer-operations-v2
