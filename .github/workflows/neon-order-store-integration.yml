name: Neon order-store integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-order-store-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Real Neon conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: neon-integration
    env:
      NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      NEON_TEST_MIGRATION_URL: ${{ secrets.NEON_TEST_MIGRATION_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify integration secrets
        shell: bash
        run: |
          if [[ -z "$NEON_TEST_DATABASE_URL" || -z "$NEON_TEST_MIGRATION_URL" ]]; then
            echo "::error::The isolated Neon integration secrets are not configured. Complete issue #31 first."
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Apply isolated test migrations
        run: npm run migrate:neon:test

      - name: Run real Neon store conformance
        run: npm run test:neon:integration

      - name: Re-run credential-free architecture validation
        run: npm run validate:neon-order-store
