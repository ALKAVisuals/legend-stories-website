name: Apply accessibility styles

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/accessibility-style-migration.yml
      - scripts/add-accessibility-styles.mjs
      - scripts/validate-dialog-accessibility.mjs

permissions:
  contents: write

concurrency:
  group: accessibility-styles-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.ref == 'agent/dialog-accessibility' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out accessibility branch
        uses: actions/checkout@v7
        with:
          ref: agent/dialog-accessibility
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Append shared accessibility styles
        run: node scripts/add-accessibility-styles.mjs

      - name: Run complete repository quality gate
        run: npm run quality

      - name: Remove temporary migration tooling
        run: git rm .github/workflows/accessibility-style-migration.yml scripts/add-accessibility-styles.mjs

      - name: Commit validated accessibility styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add durable accessibility styles"
          git push origin HEAD:agent/dialog-accessibility
