name: Apply Music navigation hotfix

on:
  push:
    branches:
      - fix/music-batch-5-card-navigation
    paths:
      - .github/workflows/apply-music-navigation-hotfix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/music-batch-5-card-navigation
          fetch-depth: 0

      - name: Repair exactly ten escaped navigation handlers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'music-legends.html';
          const source = fs.readFileSync(path, 'utf8');
          const pattern = /window\.location=\\'([^']+\.html)\\';/g;
          const matches = [...source.matchAll(pattern)];

          if (matches.length !== 10) {
            throw new Error(`Expected 10 invalid Music navigation handlers, found ${matches.length}.`);
          }

          const repaired = source.replace(pattern, "window.location='$1';");
          if (pattern.test(repaired)) {
            throw new Error('Escaped Music navigation handlers remain after repair.');
          }

          fs.writeFileSync(path, repaired, 'utf8');
          NODE

      - name: Remove one-time workflow and commit repair
        shell: bash
        run: |
          git rm .github/workflows/apply-music-navigation-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-legends.html
          git commit -m "Fix Music Batch 5 card navigation"
          git push origin HEAD:fix/music-batch-5-card-navigation
