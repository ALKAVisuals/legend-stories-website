name: Apply confirmed company details one-off

on:
  push:
    branches:
      - agent/legal-customer-operations-v2
    paths:
      - .github/workflows/apply-confirmed-company-details-once.yml
      - scripts/apply-confirmed-company-details-once.mjs

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Apply confirmed company details
        run: node scripts/apply-confirmed-company-details-once.mjs
      - name: Verify legal details
        run: |
          grep -q 'KvK 95153756' privacy.html
          grep -q 'KvK 95153756' terms.html
          grep -q 'Schutkolk 4 d 1, 6582 DB Heumen' privacy.html
          grep -q 'Schutkolk 4 d 1, 6582 DB Heumen' terms.html
          git diff --check
      - name: Full quality gate
        run: npm run quality
      - name: Commit only after all gates pass
        run: |
          git config user.name "legendmural-legal-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy.html terms.html
          git commit -m "Publish confirmed Alka Group company details"
          git push origin HEAD:agent/legal-customer-operations-v2
