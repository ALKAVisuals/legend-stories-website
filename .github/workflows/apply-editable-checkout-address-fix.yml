name: Apply editable checkout address fix

on:
  push:
    branches:
      - fix/editable-checkout-address
    paths:
      - scripts/apply-editable-checkout-address-fix.mjs
      - .github/workflows/apply-editable-checkout-address-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/editable-checkout-address
          fetch-depth: 0

      - name: Apply editable address changes
        run: node scripts/apply-editable-checkout-address-fix.mjs

      - name: Remove temporary migration files
        run: rm scripts/apply-editable-checkout-address-fix.mjs .github/workflows/apply-editable-checkout-address-fix.yml

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/checkout-address-entry.mjs tests/checkout-address-entry.test.mjs tests/checkout-address-edit-contract.test.mjs scripts/apply-editable-checkout-address-fix.mjs .github/workflows/apply-editable-checkout-address-fix.yml
          git commit -m "Keep checkout address fields editable"
          git push origin HEAD:fix/editable-checkout-address
