name: Withdrawal validation one-off
# validation pass 2

on:
  push:
    branches:
      - agent/legal-customer-operations-v1
    paths:
      - .github/workflows/withdrawal-validation-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-customer-operations-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Apply integration
        run: node scripts/integrate-withdrawal-once.mjs
      - name: Regenerate managed output
        run: |
          npm run generate:managed-product-pages:live
          npm run validate:managed-product-pages:live
          npm run generate:runtime-products
          npm run validate:runtime-products
          npm run generate:product-previews
          npm run validate:catalog
          git diff --check
      - name: Withdrawal regression tests
        run: node --test tests/withdrawal-api.test.mjs tests/withdrawal-page-contract.test.mjs
      - name: Full quality gate
        run: npm run quality
      - name: Commit green integration
        run: |
          git config user.name "legendmural-legal-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add durable online withdrawal function"
          git push origin HEAD:agent/legal-customer-operations-v1
