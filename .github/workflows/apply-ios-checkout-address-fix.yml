name: Apply iOS checkout address fix

on:
  push:
    branches:
      - fix/ios-checkout-address-input
    paths:
      - scripts/apply-ios-checkout-address-fix.mjs
      - .github/workflows/apply-ios-checkout-address-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-checkout-address-input
          fetch-depth: 0

      - name: Apply checkout address changes
        run: node scripts/apply-ios-checkout-address-fix.mjs

      - name: Remove temporary migration files
        run: rm scripts/apply-ios-checkout-address-fix.mjs .github/workflows/apply-ios-checkout-address-fix.yml

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/checkout-address-entry.mjs css/shared.css tests/checkout-address-entry.test.mjs tests/checkout-address-runtime-contract.test.mjs scripts/apply-ios-checkout-address-fix.mjs .github/workflows/apply-ios-checkout-address-fix.yml
          git commit -m "Fix iOS checkout address entry"
          git push origin HEAD:fix/ios-checkout-address-input
