name: Blocker F handoff sync

on:
  push:
    branches:
      - website/blocker-f-final-domain-20260904

permissions:
  contents: write

jobs:
  update-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record final-domain cleanup and deferred GPSR part 2B
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`${label}: expected handoff marker not found.`);
            return source.replace(from, to);
          }

          const statusPath = 'docs/CURRENT_PRODUCTION_STATUS_20260903.md';
          let status = fs.readFileSync(statusPath, 'utf8');

          status = replaceRequired(
            status,
            'Blocker D part 2A implementation started from fresh storefront `main`:\n\n`8c11c6f5ce4e8bc50cc6e64e37fd66a79df9095b`\n\nBranch:\n\n`website/blocker-d-gpsr-identity-20260904`',
            'Blocker F final-domain source cleanup started from fresh storefront `main`:\n\n`7e923a810c503fba5134c293b21de98ac8235ef0`\n\nBranch:\n\n`website/blocker-f-final-domain-20260904`',
            'repository checkpoint',
          );
          status = replaceRequired(
            status,
            '| GPSR / product-safety presentation | **65%** | Central Product ID + manufacturer/contact implementation complete; material/warning validation and physical marking remain |',
            '| GPSR / product-safety presentation | **65%** | Part 2A identity complete; part 2B intentionally deferred until exact production/material/packaging facts become available |',
            'GPSR readiness row',
          );
          status = replaceRequired(
            status,
            '| Final-domain metadata / SEO | **50%** | Old preview/GitHub Pages metadata still needs cleanup |',
            '| Final-domain metadata / SEO | **90%** | Tracked public source + production build use `legendmural.com`; only live-domain/Production verification remains |',
            'SEO readiness row',
          );
          status = replaceRequired(
            status,
            '**Overall public website launch-readiness estimate: ~85%.**',
            '**Overall public website launch-readiness estimate: ~87%.**',
            'overall readiness',
          );
          status = replaceRequired(
            status,
            '### Blocker D — GPSR / product-safety presentation — PART 2A IDENTITY IMPLEMENTED; MATERIAL VALIDATION OPEN',
            '### Blocker D — GPSR / product-safety presentation — PART 2A COMPLETE; PART 2B DEFERRED UNTIL PRODUCTION FACTS EXIST',
            'Blocker D heading',
          );
          status = replaceRequired(
            status,
            'No new safety warnings or stronger material/application claims were introduced in part 2A.',
            'No new safety warnings or stronger material/application claims were introduced in part 2A.\n\nOwner decision on 4 September 2026: the exact vinyl/media, ink family, laminate/coating status and final packaging details are not currently available. **Blocker D part 2B is therefore intentionally deferred for now.** This does not close the GPSR gate and must not be interpreted as proof of full product-safety compliance; it remains a pre-commercial-release item to resume when the real production facts exist. Website work may proceed to later non-dependent blockers.',
            'Blocker D defer note',
          );
          status = replaceRequired(
            status,
            '### Blocker F — final-domain metadata / SEO\n\nReplace remaining preview/GitHub Pages canonical/Open Graph references with correct `https://legendmural.com` handling and verify generated/public metadata.',
            '### Blocker F — final-domain metadata / SEO — TRACKED SOURCE CLEANUP COMPLETE; LIVE-DOMAIN PROOF PENDING\n\nTracked public metadata has been normalized from the historical GitHub Pages origin to the canonical production origin `https://legendmural.com`.\n\nCompleted in the website track:\n\n- root public HTML canonical/Open Graph/absolute social metadata now uses `https://legendmural.com`;\n- all 111 central product catalog canonicals use `https://legendmural.com/<product-page>`;\n- all managed product pages were regenerated from the updated central catalog;\n- the homepage canonical/Open Graph URL is the HTTPS apex `https://legendmural.com/`, not `/index.html`;\n- `sitemap.xml` uses the final origin and apex homepage URL;\n- `robots.txt` points to `https://legendmural.com/sitemap.xml`;\n- `tests/final-domain-metadata-contract.test.mjs` protects the tracked-source contract;\n- the existing Vite production-origin plugin remains defense-in-depth and production-build validation passed.\n\nNo Netlify Production deployment or live-domain verification was performed. Blocker F therefore needs only final live proof at the authorized Production release gate.',
            'Blocker F section',
          );
          status = replaceRequired(
            status,
            '2. **Blocker D:** part 2A online-offer identity is complete. Finish part 2B only after the owner provides the exact vinyl, ink, laminate/coating and packaging facts; validate real material documentation, supported use/warnings and physical marking.\n3. **Blocker F:** `legendmural.com` canonical/Open Graph/SEO cleanup.',
            '2. **Blocker D:** part 2A is complete. Part 2B is intentionally deferred until real vinyl/ink/laminate/packaging facts exist; it remains a pre-commercial-release gate.\n3. **Blocker F:** tracked-source `legendmural.com` canonical/Open Graph/sitemap/robots cleanup is complete; live-domain proof waits for the authorized Production release gate.',
            'release order',
          );

          const nextStart = '## 7. Exact next step\n\n**Do not deploy Netlify Production. Do not change PayPal/V3 behavior. Do not invent material warnings.**\n\nBlocker D part 1 and part 2A are complete. The centralized online-offer Product ID and manufacturer/contact identity are implemented across all 111 managed product pages.\n\nThe exact next website step is:\n\n> **Blocker D part 2B:** obtain the owner-confirmed exact vinyl/media, ink family, laminate/coating status and final consumer packaging. Validate the real supplier documentation, decide which existing claims are supported, add only genuinely required use/safety wording, and define the lightweight physical product/packaging label or insert. Do not invent warnings while those material facts remain unknown.\n\nNo Production deployment is authorized by this handoff.';
          const nextReplacement = '## 7. Exact next step\n\n**Do not deploy Netlify Production. Do not change PayPal/V3 behavior. Do not invent material warnings.**\n\nBlocker D part 2B is intentionally deferred because the owner does not currently have the exact production/material/packaging facts. Blocker F tracked-source cleanup is complete.\n\nThe exact next website step is:\n\n> **Final website pre-release audit/checklist:** audit the current tracked storefront and built output for remaining launch-readiness issues that can be proven before Netlify Production. Separate (a) already-proven pre-release items, (b) parked owner/legal gates such as Blocker C, deferred GPSR part 2B and the IP gate, and (c) checks that can only be performed after the eventual authorized Netlify Production cutover. Do not deploy during this audit.\n\nNo Production deployment is authorized by this handoff.';
          status = replaceRequired(status, nextStart, nextReplacement, 'exact next step');
          fs.writeFileSync(statusPath, status);

          const gpsrPath = 'docs/GPSR_PRODUCT_SAFETY_PLAN.md';
          let gpsr = fs.readFileSync(gpsrPath, 'utf8');
          gpsr = replaceRequired(
            gpsr,
            '**Status:** Blocker D part 1 audit and part 2A online-offer identity implementation complete; material confirmation, supported warning/use wording and physical marking remain.',
            '**Status:** Blocker D part 1 audit and part 2A online-offer identity implementation complete; part 2B is intentionally deferred until exact production facts become available. Material validation, supported warning/use wording and physical marking remain pre-commercial-release requirements.',
            'GPSR status',
          );
          gpsr = replaceRequired(
            gpsr,
            'Part 2A is implemented in the managed product-page system: all 111 product pages now expose the authoritative Product ID plus manufacturer postal/electronic identity centrally. Material-dependent use/safety wording remains deferred until the facts below are confirmed.',
            'Part 2A is implemented in the managed product-page system: all 111 product pages now expose the authoritative Product ID plus manufacturer postal/electronic identity centrally. Material-dependent use/safety wording remains deferred until the facts below are confirmed. The owner currently does not have those exact production facts, so part 2B is parked for now rather than guessed or fabricated.',
            'GPSR implementation note',
          );
          gpsr = replaceRequired(
            gpsr,
            '> Obtain the four owner production inputs above. Until they are known, do not publish new safety warnings and do not strengthen performance/application claims. Once received, validate the exact material documentation and produce the final centralized website + physical-label implementation specification.',
            '> **Deferred at owner request for now:** resume this step when the exact vinyl/media, ink family, laminate/coating status and packaging method become available. Until then, do not publish invented safety warnings, do not strengthen performance/application claims, and do not treat Blocker D as fully closed.',
            'GPSR exact next step',
          );
          fs.writeFileSync(gpsrPath, gpsr);
          NODE

      - name: Commit handoff update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_PRODUCTION_STATUS_20260903.md docs/GPSR_PRODUCT_SAFETY_PLAN.md
          git diff --cached --check
          git commit -m "Docs: record final-domain cleanup and deferred GPSR part 2B [skip ci]"
          git push
