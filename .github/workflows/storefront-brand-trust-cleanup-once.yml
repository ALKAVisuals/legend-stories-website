name: Migrate storefront branding and trust claims once

on:
  push:
    branches: [storefront/brand-trust-cleanup-v1]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Update storefront brand and homepage trust copy
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          changed_html = []
          for path in sorted(root.glob('*.html')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('Legend Stories', 'LegendMural')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed_html.append(path.name)

          template = Path('templates/product-page.html')
          template.write_text(
              template.read_text(encoding='utf-8').replace('Legend Stories', 'LegendMural'),
              encoding='utf-8',
          )

          generator = Path('scripts/product-page-generation.mjs')
          generator.write_text(
              generator.read_text(encoding='utf-8').replace('Legend Stories', 'LegendMural'),
              encoding='utf-8',
          )

          # Managed page generation reads descriptions and product identity from this catalog.
          catalog = Path('data/products/catalog.json')
          catalog.write_text(
              catalog.read_text(encoding='utf-8').replace('Legend Stories', 'LegendMural'),
              encoding='utf-8',
          )

          manifests = sorted(Path('data/products').glob('2026-batch-*-presentation.json'))
          if len(manifests) != 6:
              raise SystemExit(f'Expected 6 presentation manifests; found {len(manifests)}')
          for path in manifests:
              path.write_text(
                  path.read_text(encoding='utf-8').replace('Legend Stories', 'LegendMural'),
                  encoding='utf-8',
              )

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          start_marker = '            <div class="flex items-center gap-5 mt-8 justify-center lg:justify-start">'
          end_marker = '\n          </div>\n          <div class="relative max-w-sm mx-auto lg:max-w-none">'
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Homepage trust-stats region markers were not found in the expected hero structure.')
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Homepage trust-stats start marker is not unique.')
          new_stats = '''            <div class="flex items-center gap-5 mt-8 justify-center lg:justify-start" aria-label="Product benefits">
              <div class="text-center"><p class="text-sm font-bold text-text-primary">Matte vinyl</p><p class="text-[11px] text-text-muted tracking-wide">Premium finish</p></div>
              <div class="w-px h-7 bg-surface-border/50"></div>
              <div class="text-center"><p class="text-sm font-bold text-text-primary">Removable</p><p class="text-[11px] text-text-muted tracking-wide">Damage-free</p></div>
              <div class="w-px h-7 bg-surface-border/50"></div>
              <div class="text-center"><p class="text-sm font-bold text-text-primary">Ships from NL</p><p class="text-[11px] text-text-muted tracking-wide">NL · EU · US</p></div>
            </div>'''
          text = text[:start] + new_stats + text[end:]
          text = text.replace(
              'alt="The Truth Seeker — Best Selling Music Legend Wall Sticker"',
              'alt="The Truth Seeker — Music Legend Wall Sticker"',
          )
          index.write_text(text, encoding='utf-8')

          digest = hashlib.sha256(template.read_bytes()).hexdigest()
          for path in manifests:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('template', {}).get('path') != 'templates/product-page.html':
                  raise SystemExit(f'{path}: unexpected template path')
              data['template']['sha256'] = digest
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          print(f'Updated brand copy in {len(changed_html)} top-level storefront HTML files.')
          print(f'Updated {len(manifests)} presentation manifests to template SHA {digest}.')
          PY

      - name: Regenerate managed product pages and catalog
        run: |
          node scripts/generate-managed-product-pages.mjs --write-live
          node scripts/generate-full-product-catalog.mjs

      - name: Diagnose storefront cleanup invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          failed = False
          targets = [
              *sorted(Path('.').glob('*.html')),
              Path('templates/product-page.html'),
              Path('scripts/product-page-generation.mjs'),
              Path('data/products/catalog.json'),
              *sorted(Path('data/products').glob('2026-batch-*-presentation.json')),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'Legend Stories' in text:
                  print(f'::error file={path}::Legacy storefront brand remains: Legend Stories')
                  failed = True

          index = Path('index.html').read_text(encoding='utf-8')
          for claim in ('1K+', 'On Trustpilot', 'Best Selling Music Legend', '>Best seller<'):
              if claim in index:
                  print(f'::error file=index.html::Unsupported homepage trust claim remains: {claim}')
                  failed = True

          if failed:
              raise SystemExit(1)
          print('Storefront branding and homepage trust-copy invariants pass.')
          PY

      - name: Validate product contracts
        run: |
          node scripts/validate-product-variants.mjs
          node scripts/validate-full-product-catalog.mjs
          node --test tests/production-handoff.test.mjs

      - name: Run tests and build
        run: |
          npm test
          npm run build

      - name: Commit regenerated storefront cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' templates/product-page.html scripts/product-page-generation.mjs data/products/catalog.json data/products/2026-batch-*-presentation.json
          if git diff --cached --quiet; then
            echo "Storefront cleanup already synchronized."
            exit 0
          fi
          git commit -m "Update storefront branding and remove unsupported trust claims"
          git push origin HEAD:storefront/brand-trust-cleanup-v1
