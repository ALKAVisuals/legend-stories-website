<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>LegendMural form definitions</title>
</head>
<body>
  <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input type="text" name="bot-field" tabindex="-1" autocomplete="off">
    <input type="text" name="name">
    <input type="email" name="email">
    <select name="subject">
      <option value="general">General question</option>
      <option value="custom">Custom mural request</option>
      <option value="order">Order / Track order</option>
      <option value="wholesale">Wholesale / Business</option>
      <option value="other">Something else</option>
    </select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
