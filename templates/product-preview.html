<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="{{description}}">
  <title>{{name}} — {{collection}} | Legend Stories Preview</title>
  <meta property="og:title" content="{{name}} — {{collection}} | Legend Stories">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{image}}">
  <meta property="og:type" content="product">
  <script type="application/ld+json">{{structuredData}}</script>
</head>
<body data-product-slug="{{slug}}" data-batch-id="{{batchId}}" data-category="{{category}}">
  <main>
    <article>
      <img src="{{image}}" alt="{{name}} — {{collection}} Wall Sticker">
      <p>{{collection}}</p>
      <h1>{{name}}</h1>
      <p>{{description}}</p>
      <p>Compact: 30 cm longest side. Statement: 45 cm longest side. Original proportions are preserved.</p>
      <p><small>From €{{fromPriceFormatted}}</small> <strong>€{{priceFormatted}}</strong></p>
      <button
        type="button"
        class="add-to-cart-btn"
        data-name="{{name}}"
        data-price="{{price}}"
        data-variant-id="{{variantId}}"
        data-variant-label="{{variantLabel}}"
        data-size-label="{{sizeLabel}}"
        data-width-cm="{{widthCm}}"
        data-height-cm="{{heightCm}}"
        data-longest-side-cm="{{longestSideCm}}"
        data-size-cm="{{sizeCm}}"
        data-img="{{image}}"
      >Add {{variantLabel}} ({{sizeLabel}}) — €{{priceFormatted}}</button>
    </article>
  </main>
</body>
</html>
