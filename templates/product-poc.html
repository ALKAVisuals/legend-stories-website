<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <title>{{name}} — {{collection}} | Legend Stories</title>
  <meta property="og:title" content="{{name}} — {{collection}} | Legend Stories">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{image}}">
  <meta property="og:type" content="product">
  <script type="application/ld+json">{{structuredData}}</script>
</head>
<body data-product-slug="{{slug}}" data-batch-id="{{batchId}}">
  <main>
    <nav aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <a href="{{category}}-legends.html">{{collection}}</a>
    </nav>
    <article>
      <img src="{{image}}" alt="{{name}} — {{collection}} Wall Sticker">
      <p>{{collection}}</p>
      <h1>{{name}}</h1>
      <p>{{description}}</p>
      <p><strong>€{{priceFormatted}}</strong></p>
      <button type="button" data-product="{{slug}}" data-price="{{price}}">Add to cart</button>
    </article>
  </main>
</body>
</html>
