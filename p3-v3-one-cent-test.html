<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Temporary internal LegendMural €0.01 PayPal Profile-1 verification page.">
  <title>LegendMural €0.01 PayPal test</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Arial, sans-serif; background: #0d0f12; color: #f5f5f5; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { color: #b9c0ca; line-height: 1.55; }
    form { display: grid; gap: 14px; margin-top: 24px; padding: 24px; border: 1px solid #2d333b; border-radius: 16px; background: #15191e; }
    label { display: grid; gap: 7px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 9px; border: 1px solid #3c444e; background: #0d0f12; color: #fff; font: inherit; }
    button { padding: 13px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5em; font-weight: 700; }
    .warning { color: #ffd479; }
  </style>
</head>
<body>
  <main>
    <h1>Controlled €0.01 PayPal test</h1>
    <p>This temporary page creates exactly the existing internal LegendMural P3 test item. It is not linked from the storefront and will be removed after the test.</p>
    <p class="warning">Click Start only once. When PayPal opens, do not pay until the pending Profile-1 order has been checked.</p>

    <form id="p3-test-form" autocomplete="off">
      <label>Temporary test code
        <input name="key" type="password" required autocomplete="off">
      </label>
      <label>First name
        <input name="firstname" required maxlength="80">
      </label>
      <label>Last name
        <input name="lastname" required maxlength="80">
      </label>
      <label>Email
        <input name="email" type="email" required maxlength="254">
      </label>
      <label>Street + house number
        <input name="street" required maxlength="160">
      </label>
      <label>Address line 2
        <input name="line2" maxlength="160">
      </label>
      <label>Postal code
        <input name="zip" required maxlength="32">
      </label>
      <label>City
        <input name="city" required maxlength="100">
      </label>
      <button type="submit">Start €0.01 PayPal test</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script type="module" src="/js/p3-v3-one-cent-test.mjs"></script>
</body>
</html>
